<!doctype html>
<meta charset="utf-8">
<!-- 폰에서 페이지를 기기 폭으로 그린다. 이게 없으면 모바일 브라우저가 데스크톱 폭(약 980px)으로
     그린 뒤 화면에 맞게 축소해서 글자와 버튼이 전부 작아진다.
     viewport-fit=cover 는 노치 폰에서 env(safe-area-inset-*) 이 실제 값을 갖게 한다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<title>모의주식 챌린지</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0C10'/%3E%3Cpath d='M6 21l6-7 5 4 9-11' stroke='%23C6F24E' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0A0C10; --surf:#12151B; --surf2:#191D25; --surf3:#20252E;
    --line:#242A34; --line2:#2E3540;
    --text:#EDEFF3; --dim:#8B93A1; --dim2:#5C6472;
    --up:#FF4D5E; --down:#4C8DFF; --acc:#C6F24E; --warn:#F5A524; --ink:#0A0C10;
    --upT:rgba(255,77,94,.13); --downT:rgba(76,141,255,.13);
    --accT:rgba(198,242,78,.10); --warnT:rgba(245,165,36,.13);
    --sans:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{overscroll-behavior-y:none}
  /* 확대·축소 금지. 메타의 user-scalable=no 를 iOS 는 무시하므로 touch-action 과 아래 스크립트가 같이 막는다. */
  html,body{touch-action:pan-y}
  a{color:var(--acc);text-decoration:none} a:hover{color:#DCFF8A}
  .m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  #app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh; /* dvh: 모바일 주소창을 뺀 실제 높이. 없는 브라우저는 앞의 vh 를 쓴다 */background:var(--bg);
       display:flex;flex-direction:column;position:relative}
  /* 스크롤은 문서가 한다. #app 이 min-height:100vh 라 이 안에는 높이 경계가 없어서
     overflow-y:auto 를 걸어도 내부 스크롤은 생기지 않았다(실측 0px). 그런데 그 선언만으로
     #view 가 스크롤 컨테이너가 되어 안쪽 position:sticky 가 화면이 아니라 #view 기준으로
     잡혔다 — 헤더도, 하단 주문 패널도 붙지 않았다(종목 상세에서 400px 내렸을 때 주문
     패널이 화면 아래 431px 에 있었다). 그래서 지웠다. */
  .scroll{flex:1;padding-bottom:env(safe-area-inset-bottom)}
  .pad{padding:0 16px}
  button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}

  /* 헤더는 스크롤해도 붙어 있어야 한다. 종목 상세에서 호가와 주문 패널까지 내려가면
     어느 종목을 보고 있는지 화면에 남는 단서가 없었다. 배경을 깔지 않으면 아래 내용이
     헤더를 통과해 보인다. z-index 는 하단 바(5·6)보다 위, 토스트(40)보다 아래. */
  .hdr{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px 0 6px;
       border-bottom:1px solid var(--line);flex-shrink:0;
       position:sticky;top:0;z-index:8;background:rgba(10,12,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .hdr h1{font-size:17px;font-weight:600;margin:0;flex:1;display:flex;align-items:center;gap:7px}
  .iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  .lbl{font-size:12px;font-weight:600;color:var(--dim2);letter-spacing:.04em;margin-bottom:9px}
  .seg{display:flex;gap:4px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px}
  .seg button{flex:1;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;
              color:var(--dim);font-size:14px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--acc);color:var(--ink);font-weight:700}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
  .cta{height:48px;width:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;
       background:var(--acc);color:var(--ink);font-size:16px;font-weight:700}
  .cta[disabled]{background:var(--surf3);color:var(--dim2)}
  .ghost{height:46px;display:flex;align-items:center;justify-content:center;border-radius:13px;
         border:1px solid var(--line2);color:var(--dim);font-size:15px;font-weight:600}
  .hint{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--dim2);line-height:1.55;margin-top:9px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .badge{height:20px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;display:inline-flex;align-items:center}
  .row{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
  .grow{flex:1;min-width:0}
  .rt{text-align:right}
  .sticky{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--line);
          padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
  .step{display:flex;align-items:center;gap:8px;height:42px;padding:0 5px 0 12px;background:var(--bg);
        border:1px solid var(--line2);border-radius:11px}
  .step .v{flex:1;text-align:right;font-size:17px;font-weight:700}
  .step button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
               border-radius:8px;background:var(--surf3)}
  /* 가격·수량을 한 줄에 — 360px 폰에서도 두 칸이 들어가야 한다 */
  .step.sm{flex:1;min-width:0;gap:6px;padding:0 4px 0 10px}
  .step.sm .k{font-size:10px;color:var(--dim2);width:20px;flex-shrink:0}
  .step.sm .v{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step.sm button{width:30px;height:30px}
  .chips{display:flex;gap:6px}
  .chips button{flex:1;height:30px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:8px;
                border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:600}
  .tabs{display:flex;gap:4px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:12px;margin:0 16px}
  .tabs button{flex:1;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;
               color:var(--dim2);font-size:14px;font-weight:500}
  .tabs button[aria-pressed="true"]{background:var(--surf3);color:var(--text);font-weight:700}
  .bar{height:3px;border-radius:2px;background:var(--surf3);display:flex;overflow:hidden}
  .bar i{background:var(--acc);border-radius:2px;display:block}
  /* 바깥은 계속 통과시킨다 — 토스트가 없는 자리는 아래 화면을 그대로 쓸 수 있어야 한다. */
  .toastwrap{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
             display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;
             padding:0 16px calc(12px + env(safe-area-inset-bottom))}
  /* 토스트 자체는 클릭을 받아야 한다. pointer-events 를 물려받으면 안쪽 '바로 매수' 버튼이
     클릭을 못 받고 뒤쪽 호가 행으로 빠진다(실측: elementFromPoint 가 SPAN.qcell 을 돌려줬다). */
  .toast{position:relative;width:100%;max-width:398px;background:var(--surf2);border:1px solid var(--line2);
         border-radius:16px;padding:13px 15px;box-shadow:0 18px 44px rgba(0,0,0,.6);
         animation:rise .22s ease-out;pointer-events:auto;cursor:pointer}
  @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .toast.out{animation:sink .16s ease-in forwards}
  @keyframes sink{to{transform:translateY(8px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.toast,.toast.out{animation:none}}
  /* 닫기 단추. 모서리에 걸쳐 두면 토스트 안쪽 레이아웃을 밀지 않는다.
     토스트 어디를 눌러도 닫히므로 실제 탭 영역은 토스트 전체다. */
  .tclose{position:absolute;top:-9px;right:-9px;width:32px;height:32px;border-radius:50%;
          background:var(--surf3);border:1px solid var(--line2);color:var(--dim);
          display:flex;align-items:center;justify-content:center;
          box-shadow:0 4px 14px rgba(0,0,0,.55);z-index:2}
  .tclose:active{background:var(--line2);color:var(--text)}
  .tallwrap{width:100%;max-width:398px;display:flex;justify-content:center}
  .tallclose{pointer-events:auto;height:34px;padding:0 14px;border-radius:17px;background:var(--surf3);
             border:1px solid var(--line2);color:var(--dim);font-size:12px;font-weight:600;
             box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .tallclose:active{background:var(--line2);color:var(--text)}
  .modalbg{position:fixed;inset:0;background:rgba(4,6,9,.8);z-index:50;display:flex;align-items:center;
           justify-content:center;padding:16px}
  .modal{width:100%;max-width:398px;background:var(--surf);border:1px solid var(--line2);border-radius:20px;padding:20px;
         box-shadow:0 28px 70px rgba(0,0,0,.65)}
  canvas{display:block;width:100%;height:200px}
  .depthrow{display:flex;align-items:center;height:30px;border-bottom:1px solid var(--line)}
  /* 좌우 잔량 셀은 같은 폭이어야 막대 길이를 비교할 수 있다. 고정폭은 375px 폰에서 넘치므로 flex 로 나눈다. */
  .qcell{flex:1 1 0;min-width:0;height:30px;position:relative;display:flex;align-items:center}
  .qcell.a{justify-content:flex-end;padding-right:12px;gap:7px}
  .qcell.b{gap:7px;padding-left:12px}
  .qbar{position:absolute;top:3px;height:24px;border-radius:3px}
  /* 호가 가격 칸은 버튼이다 — 누르면 그 가격이 주문가(지정가)가 된다. 다시 누르면 시장가로 돌아간다. */
  .pcell:active{filter:brightness(1.35)}
  .pcell{flex:0 0 104px;height:30px;display:flex;flex-direction:column;
         align-items:center;justify-content:center;background:var(--surf);
         border-left:1px solid var(--line);border-right:1px solid var(--line)}

  /* ── HTS 의 표·시세 요소 ──
     실제 증권 앱처럼 열 머리(thead), 잔량 합계, 가격 반짝임, 주문 확인 시트를 둔다. */
  .sec{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
  .sec h2{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0}
  .sec h2 small{font-size:11px;font-weight:500;color:var(--dim2);margin-left:4px}
  .sec .meta{font-size:11px;color:var(--dim2)}
  .thead{display:flex;align-items:center;gap:10px;height:28px;padding:0 16px;
         border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surf);
         font-size:10px;font-weight:600;color:var(--dim2);letter-spacing:.02em}
  button.row{transition:background .12s}
  button.row:active{background:var(--surf2)}
  .tri{display:inline-block;font-size:9px;margin-right:2px;vertical-align:2px}
  /* 값이 바뀐 칸을 잠깐 물들인다 — 오르면 붉게, 내리면 푸르게 */
  [data-fl="up"]{animation:flup .6s ease-out}
  [data-fl="down"]{animation:fldn .6s ease-out}
  @keyframes flup{from{background:rgba(255,77,94,.32)}to{background:transparent}}
  @keyframes fldn{from{background:rgba(76,141,255,.32)}to{background:transparent}}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
      border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .kv div{background:var(--surf);padding:6px 8px}
  .kv .k{font-size:10px;color:var(--dim2)}
  .kv .v{font-size:12px;font-weight:600;margin-top:3px}
  .obtot{display:flex;align-items:center;height:36px;margin-top:-1px;border-top:1px solid var(--line2);
         border-bottom:1px solid var(--line2);background:var(--surf)}
  .obtot span{flex:1;padding:0 12px;font-size:12px;font-weight:700}
  .obtot .c{flex:0 0 104px;text-align:center;font-size:10px;font-weight:600;color:var(--dim2)}
  .ratio{height:4px;border-radius:2px;display:flex;overflow:hidden;background:var(--surf3);gap:2px}
  .ratio i{display:block;height:100%}
  .inp{width:100%;height:52px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);
       color:var(--text);font-family:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
  .inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accT)}
  .inp::placeholder{color:var(--dim2)}
  /* 주문 확인 시트. 토스트(40)보다 아래에 두어 확인 중에도 돌발뉴스가 보이게 한다. */
  .sheetbg{position:fixed;inset:0;background:rgba(4,6,9,.62);z-index:30;display:flex;align-items:flex-end;
           justify-content:center;animation:fade .16s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:430px;background:var(--surf);border:1px solid var(--line2);border-bottom:none;
         border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));
         box-shadow:0 -18px 50px rgba(0,0,0,.55);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
  .kvrow{display:flex;align-items:center;height:42px;padding:0 14px;border-bottom:1px solid var(--line)}
  .kvrow .k{flex:1;font-size:12px;color:var(--dim)}
  /* 뉴스 토스트의 남은 시간 막대 */
  .tlife{position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:1px;background:var(--warn);
         transform-origin:left;animation:life linear forwards;opacity:.8}
  @keyframes life{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.sheetbg,.sheet,[data-fl],.tlife{animation:none}}
</style>

<div id="app">
  <div id="view" class="scroll"></div>
</div>
<div class="toastwrap" id="toasts"></div>
<div id="modal"></div>
<div id="sheet"></div>


<script>
/* ============================================================================
   서버 클라이언트
   프로토타입의 더미 엔진이 있던 자리다. docs/API.md 의 계약을 그대로 호출하고,
   화면 코드는 S.snap(공개 스냅샷) / S.me(내 정보) 두 개만 읽는다.
   ========================================================================= */
/* iOS Safari 는 viewport 의 user-scalable=no 를 무시한다. 핀치 제스처와 두 손가락 이동을 직접 막는다.
   한 손가락 스크롤과 탭은 건드리지 않는다. */
for(const ev of ['gesturestart','gesturechange','gestureend'])
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e=>{ if(e.touches.length>1||(e.scale!==undefined&&e.scale!==1)) e.preventDefault(); }, {passive:false});

const LSK = 'stock-challenge:';
function lsGet(k,d){ try{const v=localStorage.getItem(LSK+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem(LSK+k,JSON.stringify(v));}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(LSK+k);}catch(e){} }

const S = {
  pool:[], defaults:{},
  tickTable:[{under:2000,tick:5},{under:5000,tick:10},{under:null,tick:25}],
  roomCode:null, title:'', hostToken:null, playerToken:null, playerId:null, myName:'',
  deviceId:null,
  snap:null, me:null, lobby:null, result:null,
  es:null, stream:'idle',        // idle | connecting | live | lost
  fresh:true,                    // 연결 직후 1회. 밀린 체결·뉴스를 토스트로 쏟지 않는다
  myIpoBids:{},                  // 서버는 내 청약 내역을 따로 주지 않아 화면이 집계한다
  chart:{code:null, rows:[], at:0},
  seenNews:new Set(), seenNotice:0,
  booted:false,
};

S.deviceId = lsGet('device',null);
if(!S.deviceId){ S.deviceId='d'+Math.random().toString(36).slice(2)+Date.now().toString(36); lsSet('device',S.deviceId); }

/* 설정값은 방마다 다르다. 스냅샷 → 로비 → /api/meta 기본값 순으로 본다.
   화면이 CFG.lotSize 처럼 읽으면 항상 지금 방의 값이 나온다. */
function cfgv(k,d){
  if(S.snap&&S.snap.config&&S.snap.config[k]!==undefined) return S.snap.config[k];
  if(S.lobby&&S.lobby.config&&S.lobby.config[k]!==undefined) return S.lobby.config[k];
  if(S.defaults&&S.defaults[k]!==undefined) return S.defaults[k];
  return d;
}
const CFG = {
  get lotSize(){return cfgv('lotSize',10);},
  get feeRate(){return cfgv('feeRate',0.0015);},
  get seedMoney(){return cfgv('seedMoney',1000000);},
  get salaryAmount(){return cfgv('salaryAmount',100000);},
  get salaryIntervalSec(){return cfgv('salaryIntervalSec',60);},
  get inflationPerMin(){return cfgv('inflationPerMin',0.005);},
  get maxBonusRate(){return cfgv('maxBonusRate',0.05);},
  get openPremium(){return cfgv('openPremium',0);},
  get durationMin(){return cfgv('durationMin',15);},
  get ipoSec(){return cfgv('ipoSec',45);},
};

/* 호가 단위표는 /api/meta 에서 받는다 — 서버와 어긋나지 않게 */
const tickSize = p => { for(const r of S.tickTable) if(r.under===null||p<r.under) return r.tick; return 25; };
const roundTick = p => { const t=tickSize(p); return Math.max(t,Math.round(p/t)*t); };
const floorLot  = q => { const l=CFG.lotSize; return Math.max(0,Math.floor(q/l)*l); };

const stocks  = () => (S.snap&&S.snap.stocks)||[];
const stockOf = c => stocks().find(s=>s.code===c)||null;
const isHost  = () => !!S.hostToken;
/* 월급 횟수와 다음 지급까지 남은 시간. 서버는 공모가 끝난 뒤부터 센다(_applySalary). */
const paidSec = () => S.snap? Math.max(0, S.snap.elapsedSec-CFG.ipoSec) : 0;
const salaryCount = () => { const iv=CFG.salaryIntervalSec; return iv>0? Math.floor(paidSec()/iv) : 0; };
const nextSalarySec = () => { const iv=CFG.salaryIntervalSec; return iv>0? iv-(paidSec()%iv) : 0; };

const EMPTY_ME = {id:null,name:'',isBot:false,rank:null,rankTotal:0,cash:0,lockedCash:0,
  nav:0,invested:1,salaryTotal:0,realized:0,holdings:[],openOrders:[],tradable:[],newFills:[]};

/* ---- HTTP ---------------------------------------------------------------
   오류는 서버가 주는 {code,message} 를 그대로 던진다. 화면은 toastErr 로 받는다. */
async function api(method,path,body){
  const h={};
  if(body!==undefined) h['Content-Type']='application/json';
  if(S.playerToken) h['X-Player-Token']=S.playerToken;
  if(S.hostToken)   h['X-Host-Token']=S.hostToken;
  let r;
  try{ r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(e){ throw {code:'NETWORK',message:'서버에 연결할 수 없습니다'}; }
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw (data&&data.error)||{code:'HTTP_'+r.status,message:'요청이 실패했습니다'};
  return data;
}
const R = p => '/api/rooms/'+encodeURIComponent(S.roomCode)+p;

/* ---- SSE ---------------------------------------------------------------- */
function closeStream(){ if(S.es){S.es.close(); S.es=null;} S.stream='idle'; }
function openStream(){
  closeStream();
  S.stream='connecting'; S.fresh=true;
  const q = S.playerToken? '?token='+encodeURIComponent(S.playerToken) : '';
  const es = new EventSource(R('/stream')+q);
  S.es = es;
  es.addEventListener('state',ev=>{
    let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    S.stream='live';
    applyState(d.snapshot, d.me||null);
  });
  // EventSource 는 끊기면 알아서 다시 붙는다. 다시 붙으면 서버가 체결 커서를 0 부터
  // 다시 세서 지난 체결이 한꺼번에 온다 — 그래서 재연결 직후 한 번은 토스트를 건너뛴다.
  es.onerror = ()=>{ if(S.stream!=='connecting') S.stream='lost'; S.fresh=true; render(); };
}

function applyState(snap, me){
  const prev = S.snap? S.snap.phase : null;
  S.snap = snap;
  if(me) S.me = me;
  if(S.fresh){
    S.seenNotice = snap.notices.length? snap.notices[snap.notices.length-1].seq : 0;
    S.seenNews = new Set(snap.news.map(x=>x.id));
    S.fresh = false;
  }else{
    if(me&&me.newFills) for(const f of me.newFills) pushFill(f);
    for(const nw of snap.news)    if(!S.seenNews.has(nw.id)){ S.seenNews.add(nw.id); onNews(nw); }
    for(const nt of snap.notices) if(nt.seq>S.seenNotice){ S.seenNotice=nt.seq; onNotice(nt); }
  }
  routePhase(prev, snap.phase);
  render();
}

function routePhase(prev,cur){
  if(prev===cur) return;
  U.sheet=null;                      // 단계가 바뀌면 열려 있던 주문 확인창은 의미가 없다
  if(cur==='ipo'){ U.view='ipo'; U.ipoPrice=0; U.ipoQty=0; }
  else if(cur==='trading'){ if(['home','join','setup','lobby','ipo','result'].includes(U.view)) U.view='market'; }
  else if(cur==='ended'){ U.view='result'; loadResult(); }
  else if(cur==='lobby') U.view='lobby';
}

/* ---- 조회 --------------------------------------------------------------- */
async function loadResult(){
  try{ S.result = await api('GET', R('/result')); render(); }catch(e){}
}
async function loadChart(code){
  if(!S.roomCode||!code) return;
  if(S.chart.code===code && Date.now()-S.chart.at<1500) return;
  S.chart.at = Date.now();
  try{
    const d = await api('GET', R('/chart?code=')+encodeURIComponent(code));
    const row = d.stocks && d.stocks[0];
    S.chart = {code, rows:(row&&row.history)||[], at:Date.now()};
    if(U.view==='stock'&&U.tab==='차트') drawChart();
  }catch(e){}
}
async function refreshLobby(){
  try{ S.lobby = await api('GET', R('')); S.title = S.lobby.title; }catch(e){}
}

/* ---- 방 ----------------------------------------------------------------- */
function persist(){
  lsSet('room',{code:S.roomCode,hostToken:S.hostToken,playerToken:S.playerToken,
                name:S.myName,title:S.title});
}
function forget(){
  closeStream();
  lsDel('room');
  S.roomCode=null; S.hostToken=null; S.playerToken=null; S.playerId=null;
  S.snap=null; S.me=null; S.lobby=null; S.result=null; S.myIpoBids={};
  S.seenNews=new Set(); S.seenNotice=0;
}

/* 방장도 같이 뛴다 — 방을 만든 뒤 바로 참가까지 한다. */
async function createRoom(config,title,name){
  const d = await api('POST','/api/rooms',{title,config});
  closeStream();
  S.roomCode=d.roomCode; S.hostToken=d.hostToken; S.title=d.title; S.lobby=d.lobby;
  S.playerToken=null; S.playerId=null;
  S.snap=null; S.me=null; S.result=null; S.myIpoBids={};
  S.seenNews=new Set(); S.seenNotice=0;
  await joinRoom(S.roomCode, name);
  return d;
}
async function joinRoom(code,name){
  S.roomCode = String(code||'').trim().toUpperCase();
  const d = await api('POST', R('/join'), {name, deviceId:S.deviceId});
  S.playerToken=d.playerToken; S.playerId=d.playerId; S.myName=d.name;
  persist();
  await refreshLobby();
  openStream();
  return d;
}

/* ---- 시작 --------------------------------------------------------------- */
async function boot(){
  try{
    const m = await api('GET','/api/meta');
    S.pool = m.stockPool || [];
    S.defaults = m.defaults || {};
    if(Array.isArray(m.tickSizeTable)&&m.tickSizeTable.length) S.tickTable=m.tickSizeTable;
    U.codes  = (S.defaults.stockCodes||S.pool.slice(0,6).map(s=>s.code)).slice();
    U.dur    = S.defaults.durationMin!==undefined? S.defaults.durationMin : U.dur;
    U.ipoSec = S.defaults.ipoSec!==undefined? S.defaults.ipoSec : U.ipoSec;
    U.seed   = S.defaults.seedMoney!==undefined? S.defaults.seedMoney : U.seed;
    U.bots   = S.defaults.botCount!==undefined? S.defaults.botCount : U.bots;
  }catch(e){
    S.booted=true; renderNow();
    toastErr({code:e.code||'NO_META',message:'서버에 연결하지 못했습니다. 새로고침해 주세요'});
    return;
  }

  // 새로고침이나 통신 끊김에서 돌아온 경우 — 보관해 둔 토큰이 아직 유효한지 확인한다.
  const saved = lsGet('room',null);
  if(saved && saved.code){
    S.roomCode=saved.code; S.hostToken=saved.hostToken||null;
    S.title=saved.title||''; S.myName=saved.name||'';
    if(saved.playerToken){
      S.playerToken=saved.playerToken;
      try{
        const d = await api('POST', R('/resume'), {playerToken:saved.playerToken});
        S.playerId=d.playerId; S.myName=d.name;
      }catch(e){ S.playerToken=null; }
    }
    if(S.playerToken||S.hostToken){
      try{ await refreshLobby(); U.view='lobby'; persist(); openStream(); }
      catch(e){ forget(); }
    }else forget();
  }
  S.booted=true;
  renderNow();
}
</script>

<script>
/* ============================================================================
   화면
   ========================================================================= */
const $ = s => document.querySelector(s);
const view = $('#view'), toastEl = $('#toasts'), modalEl = $('#modal'), sheetEl = $('#sheet');
const U = { view:'home', codes:[], dur:15, ipoSec:45, seed:1000000, bots:30,
            name:'', joinCode:'', title:'',
            code:null, tab:'호가', qty:0, side:'buy',
            ipoCode:null, ipoPrice:0, ipoQty:0, sort:'chg', busy:false,
            sheet:null, px:null, pxPinned:false, confirmOn:lsGet('confirm',true), skipNext:false };   // px: 호가에서 고른 지정가. null 이면 시장가

const n  = v => Math.round(v).toLocaleString('en-US');
const pc = v => (v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%';
const p1 = v => (v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
const sg = v => (v>=0?'+':'−')+n(Math.abs(v));
const cl = v => v>=0?'var(--up)':'var(--down)';
/* 시세 색은 증권 앱 관례를 따른다 — 오르면 붉게, 내리면 푸르게, 보합은 본문색. */
const clz= v => v>0?'var(--up)':v<0?'var(--down)':'var(--text)';
const tri= v => v>0?'<span class="tri">▲</span>':v<0?'<span class="tri">▼</span>':'';
const clk= s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.round(s)%60).padStart(2,'0');
const esc= s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function light(hex,a=.3){const v=parseInt(String(hex||'#888888').slice(1),16),f=x=>Math.round(x+(255-x)*a);
  return '#'+[f(v>>16&255),f(v>>8&255),f(v&255)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const dot = (c,s=9)=>`<span class="dot" style="width:${s}px;height:${s}px;background:${light(c)}"></span>`;
const svg = (d,sz=20,c='var(--dim)',w=1.6)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"
  stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const iBack=`${svg('M15 5l-7 7 7 7',22,'var(--text)',1.8)}`;
const iMinus=svg('M5 12h14',18,'var(--dim)',2), iPlus=svg('M12 5v14M5 12h14',18,'var(--text)',2);
const iInfo='M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v5M12 7.6v.2';
const iBolt='M13 3L5 14h6l-1 7 8-11h-6l1-7z';
const iCard='M3 8a2 2 0 012-2h13a1 1 0 011 1v2M3 8v9a2 2 0 002 2h14a1 1 0 001-1v-3M3 8h17M21 11h-4a2 2 0 000 4h4';

/* ---- 토스트 ---- */
/* 토스트를 매번 통째로 다시 그리면, 떠 있던 뉴스 토스트의 '바로 매수' 버튼이 DOM 에서
   떨어져 누르던 탭이 씹힌다. 그래서 새로 뜬 것만 붙이고 사라질 것만 뗀다. */
let toasts=[];
function showToast(html,ms=4200){
  const id='t'+Math.random().toString(36).slice(2);
  toasts.push({id,timer:setTimeout(()=>closeToast(id),ms)});
  const el=document.createElement('div');
  el.className='toast'; el.dataset.toast=id;
  el.innerHTML=`<button class="tclose" data-act="closeToast" data-v="${id}" aria-label="알림 닫기">
    ${svg('M6 6l12 12M18 6L6 18',15,'currentColor',1.9)}</button>${html}`;
  toastEl.appendChild(el);
  while(toasts.length>3) closeToast(toasts[0].id);   // 3개까지만 쌓는다
  syncAllClose();
}
function closeToast(id){
  const t=toasts.find(x=>x.id===id);
  if(t){ clearTimeout(t.timer); toasts=toasts.filter(x=>x.id!==id); }
  const el=toastEl.querySelector(`[data-toast="${id}"]`);
  if(el){ el.classList.add('out'); setTimeout(()=>el.remove(),170); }
  syncAllClose();
}
function closeAllToasts(){ for(const t of toasts.slice()) closeToast(t.id); }
/* 여러 개가 겹치면 하나씩 닫기 번거롭다 — 2개 이상일 때만 '모두 닫기' 를 얹는다. */
function syncAllClose(){
  let w=toastEl.querySelector('.tallwrap');
  if(toasts.length<2){ if(w) w.remove(); return; }
  if(!w){
    w=document.createElement('div'); w.className='tallwrap';
    w.innerHTML=`<button class="tallclose" data-act="closeToasts" aria-label="알림 모두 닫기"></button>`;
    toastEl.insertBefore(w,toastEl.firstChild);
  }
  if(w!==toastEl.firstChild) toastEl.insertBefore(w,toastEl.firstChild);
  w.querySelector('.tallclose').textContent=`알림 ${toasts.length}개 모두 닫기`;
}
/* 토스트 어디를 눌러도 닫힌다. 안쪽 버튼(바로 매수·헤드라인)은 그대로 동작한다. */
toastEl.addEventListener('click',e=>{
  const box=e.target.closest('.toast'); if(!box) return;
  if(e.target.closest('button,a,[data-act]')) return;
  closeToast(box.dataset.toast);
});

/* 체결 알림. me.newFills 는 직전 전송 이후의 신규분만 오므로 그대로 띄우면 중복이 없다.
   수수료는 서버가 체결금액에 feeRate 를 곱해 내림한 값이라(_settleTrades) 같은 식으로 계산한다. */
function pushFill(f){
  const fee = Math.floor(f.amount*CFG.feeRate);
  // 지정가보다 유리한 호가가 있으면 그 가격에 체결된다(매도는 더 비싸게, 매수는 더 싸게). 차이를 적어 준다 —
  // 1,140 에 낸 매도가 1,170 에 체결됐을 때 "잘못 팔렸다" 로 읽히지 않게.
  const w = S.lastPx && S.lastPx[f.code+'|'+f.side];
  const better = (w && Date.now()-w.t<60000 && w.px!==f.price)
    ? `<div class="m" style="font-size:11px;color:var(--acc);margin-top:2px">지정가 ${n(w.px)} → ${n(f.price)} 체결 · ${n(Math.abs(f.price-w.px))}원 유리</div>` : '';
  showToast(`<div style="display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
      justify-content:center;background:${f.side==='buy'?'var(--upT)':'var(--downT)'}">
      ${svg('M4 12.5l5 5L20 6.5',17,f.side==='buy'?'var(--up)':'var(--down)',2)}</div>
    <div class="grow"><div style="font-size:13px;font-weight:700">${f.side==='buy'?'매수':'매도'} 체결 · ${esc(f.name)}${f.tag?' ('+esc(f.tag)+')':''}</div>
      <div class="m" style="font-size:11px;color:var(--dim2);margin-top:2px">${n(f.price)} × ${n(f.qty)}주 · 수수료 ${n(fee)}</div>${better}</div>
    <div class="m" style="font-size:15px;font-weight:700;color:${f.side==='buy'?'var(--up)':'var(--down)'}">
      ${f.side==='buy'?'−':'+'}${n(f.amount)}</div></div>`);
}

/* 공지. 서버가 보내는 notices[].kind 를 그대로 쓴다.
   news-up / news-down 은 아래 onNews 가 훨씬 큰 카드로 띄우므로 여기서는 건너뛴다. */
function onNotice(nt){
  if(nt.kind==='news-up'||nt.kind==='news-down') return;
  const skin = {
    salary:{icon:iCard, c:'var(--acc)', bg:'var(--accT)', t:'월급 입금'},
    bonus :{icon:'M12 3v18M5 10l7-7 7 7', c:'var(--acc)', bg:'var(--accT)', t:'무상증자'},
    ipo   :{icon:iBolt, c:'var(--warn)', bg:'var(--warnT)', t:'개장 공모'},
    open  :{icon:iBolt, c:'var(--up)',  bg:'var(--upT)',   t:'개장'},
    close :{icon:iInfo, c:'var(--dim)', bg:'var(--surf3)', t:'마감'},
    kick  :{icon:iInfo, c:'var(--warn)',bg:'var(--warnT)', t:'안내'},
  }[nt.kind] || {icon:iInfo, c:'var(--dim)', bg:'var(--surf3)', t:'안내'};
  const extra = nt.kind==='salary'
    ? `<div style="font-size:10px;color:var(--dim2);margin-top:3px">인플레는 현금을 깎지 않습니다 — 적정가가 분당 ${(CFG.inflationPerMin*100).toFixed(1)}% 오릅니다</div>` : '';
  const amt = nt.kind==='salary'
    ? `<div class="m" style="font-size:16px;font-weight:700;color:var(--acc)">+${n(CFG.salaryAmount)}</div>` : '';
  showToast(`<div style="display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
      justify-content:center;background:${skin.bg}">${svg(skin.icon,18,skin.c,1.5)}</div>
    <div class="grow"><div style="font-size:13px;font-weight:700">${skin.t}${nt.kind==='salary'?' · '+salaryCount()+'분차':''}</div>
      <div style="font-size:11px;color:var(--dim2);margin-top:2px">${esc(nt.text)}</div>${extra}</div>${amt}</div>`);
}

/* 돌발뉴스. 판당 약 12건이라 화면을 막는 모달은 쓸 수 없다 — 토스트 + 상단 배너로 알린다.
   sign 과 impactPct 는 방향이 그대로 드러나므로 화면에 쓰지 않는다(헤드라인으로 판단하는 게 설계 의도).
   바로 매수·매도는 편의가 아니라 밸런스다 — 뉴스에 소극적으로 대응하면 현금이 묶인 채 뒤처진다.
   주문은 화면 어디서나 시장가 하나뿐이므로 여기서도 가격을 만들지 않는다. */
function onNews(nw){
  const s = stockOf(nw.code); if(!s) return;
  const me = S.me;
  const tr = (me&&me.tradable.find(t=>t.code===nw.code)) || {maxBuyQty:0,maxSellQty:0};
  const canSell = tr.maxSellQty>=CFG.lotSize;
  const canAct = !!me && S.snap && S.snap.phase==='trading';
  showToast(`<div style="display:flex;align-items:center;gap:9px">
      <span class="badge" style="background:var(--warnT);color:var(--warn);gap:4px;letter-spacing:.04em">
        ${svg(iBolt,12,'var(--warn)',1.6)}돌발 뉴스</span>
      ${dot(s.color,8)}<span style="font-size:12px;color:var(--dim)">${esc(s.name)}</span>
      <span class="grow"></span>
      <span class="m" style="font-size:12px;font-weight:700">${n(s.last)}</span></div>
    <button data-act="stock" data-v="${nw.code}" style="display:block;width:100%;text-align:left;
      font-size:15px;font-weight:700;line-height:1.4;margin-top:9px">${esc(nw.headline)}</button>
    ${canAct?`<div style="display:flex;gap:8px;margin-top:12px">
      <button data-act="newsSell" data-v="${nw.code}" ${canSell?'':'disabled'}
        style="flex:1;height:46px;border-radius:11px;background:${canSell?'var(--downT)':'transparent'};
        border:1px solid ${canSell?'var(--down)':'var(--line)'};color:${canSell?'var(--down)':'var(--dim2)'};
        font-size:14px;font-weight:700">바로 매도</button>
      <button data-act="newsBuy" data-v="${nw.code}"
        style="flex:1;height:46px;border-radius:11px;background:var(--up);color:#fff;
        font-size:14px;font-weight:700">바로 매수</button></div>
    <div style="font-size:10px;color:var(--dim2);margin-top:8px">보유 현금(또는 주식)의 절반으로 현재가에 즉시 체결합니다. 먼저 반응할수록 유리합니다.</div>`:''}
    <div class="tlife" style="animation-duration:11000ms"></div>`, 11000);
}
function newsBanner(snap){
  if(!snap.news.length) return '';
  return `<div class="pad" style="padding-top:12px;display:flex;flex-direction:column;gap:6px">
    ${snap.news.map(nw=>`<button data-act="stock" data-v="${nw.code}" style="width:100%;text-align:left;display:flex;
        align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--warnT);
        border:1px solid rgba(245,165,36,.3);min-height:44px">
        ${svg(iBolt,15,'var(--warn)',1.6)}
        <span class="grow" style="font-size:12px;font-weight:600;line-height:1.4">${esc(nw.headline)}</span>
        <span class="m" style="font-size:11px;color:var(--dim2);flex-shrink:0">${Math.max(0,nw.lifeSec-nw.ageSec)}초</span>
      </button>`).join('')}</div>`;
}
function toastErr(e){
  // 시장가에 반대 호가가 없는 건 정상 상황이다 — 지정가로 걸어둘 수 있다고 알려준다.
  if(e&&e.code==='NO_COUNTERPARTY') e={...e, message:(e.message||'지금은 반대 호가가 없습니다')+' · 호가를 눌러 지정가로 걸어둘 수 있습니다'};
  showToast(`<div style="display:flex;gap:10px;align-items:center">
  <div style="width:32px;height:32px;border-radius:10px;background:var(--warnT);flex-shrink:0;
    display:flex;align-items:center;justify-content:center">${svg('M12 8v5M12 16.4v.2M10.3 4.3L2.8 17.5A1.5 1.5 0 004.1 20h15.8a1.5 1.5 0 001.3-2.5L13.7 4.3a1.5 1.5 0 00-2.6 0z',17,'var(--warn)',1.6)}</div>

/* 연결이 끊기면 화면 값이 멈춘다. 참가자가 그걸 모르면 안 된다. */
function connBanner(){
  if(S.stream!=='lost') return '';
  return `<div class="pad" style="padding-top:10px"><div style="display:flex;align-items:center;gap:8px;
    padding:10px 12px;border-radius:11px;background:var(--warnT);border:1px solid rgba(245,165,36,.3)">
    ${svg(iInfo,15,'var(--warn)',1.6)}<span style="font-size:12px;font-weight:600">연결이 끊겼습니다 — 다시 붙는 중입니다</span></div></div>`;
}
function pausedBanner(){ return ''; }   // 일시정지는 아래 모달로 알린다
/* 모달이 화면 전체를 덮으므로 방장의 '재개' 도 같이 덮인다 — 재개 버튼을 모달 안에 둔다.
   매 푸시(400ms)마다 다시 그리면 버튼이 DOM 에서 떨어져 클릭이 씹히므로, 상태가 바뀔 때만 갈아끼운다. */
let pausedShown = null;
function renderPaused(snap){
  const on = !!(snap && snap.paused);
  const key = on ? (isHost()?'host':'guest') : 'off';
  if(pausedShown===key) return;
  pausedShown = key;
  modalEl.innerHTML = on ? `<div class="modalbg">
    <div class="modal" style="text-align:center;padding:32px 24px">
      <div style="display:flex;justify-content:center">${svg('M9 6v12M15 6v12',34,'var(--acc)',2)}</div>
      <div style="font-size:20px;font-weight:700;margin-top:14px">일시정지</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6;margin-top:8px">
        방장이 게임을 멈췄습니다. 남은 시간도 함께 멈춰 있습니다.</div>
      ${isHost()?`<button class="cta" data-act="pause" data-v="0" style="margin-top:20px">재개하기</button>`:''}
    </div></div>` : '';
}

/* 주문 확인 시트 — 실제 증권 앱의 '매수 확인' 창. 시장가뿐이라 기준가는 시트를 연 순간의 현재가다.
   내용을 매 푸시마다 갈아끼우면 버튼이 DOM 에서 떨어져 탭이 씹히므로, 주문 내용이 바뀔 때만 다시 그린다.
   뉴스 토스트의 '바로 매수' 는 이 창을 거치지 않는다 — 거기서는 속도가 곧 밸런스다. */
function orderSheet(o){
  const s=stockOf(o.code)||{name:o.code,color:'#888'}, buying=o.side==='buy';
  const fee=Math.floor(o.px*o.qty*CFG.feeRate), amt=buying? o.px*o.qty+fee : o.px*o.qty-fee;
  return `<div class="sheetbg" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="주문 확인">
    <div class="grip"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="badge" style="background:${buying?'var(--upT)':'var(--downT)'};color:${buying?'var(--up)':'var(--down)'}">${buying?'매수':'매도'} 확인</span>
      ${dot(s.color,8)}<span style="font-size:15px;font-weight:700">${esc(s.name)}</span>
      <span class="m" style="font-size:11px;color:var(--dim2)">${esc(o.code)}</span></div>
    <div style="margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden">
      ${[['주문 가격', n(o.px)+'원 (지정가)'],['수량',n(o.qty)+'주'],
         ['수수료',n(fee)+'원 ('+(CFG.feeRate*100).toFixed(2)+'%)']].map(([k,v])=>
        `<div class="kvrow"><span class="k">${k}</span><span class="m" style="font-size:13px;font-weight:600">${v}</span></div>`).join('')}
      <div style="display:flex;align-items:center;height:52px;padding:0 14px;background:var(--surf2)">
        <span class="grow" style="font-size:13px;font-weight:600">${buying?'예상 지출':'예상 수령'}</span>
        <span class="m" style="font-size:18px;font-weight:700;color:${buying?'var(--up)':'var(--down)'}">${n(amt)}원</span></div></div>
    <div class="hint">${svg(iInfo,16,'var(--dim2)',1.5)}
      <span>이 가격보다 유리한 호가가 있으면 그 가격에 바로 체결되고(매도는 더 비싸게, 매수는 더 싸게), 없으면 호가창에 남아 기다립니다. 미체결 주문은 언제든 취소할 수 있습니다.</span></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--dim);cursor:pointer;height:32px">
      <input type="checkbox" data-act="skipConfirm" style="width:16px;height:16px;margin:0;accent-color:var(--acc)">다음부터 확인 없이 바로 주문</label>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="ghost" style="width:104px;height:54px" data-act="closeSheet">취소</button>
      <button data-act="confirmOrder" style="flex:1;height:54px;border-radius:13px;font-size:16px;font-weight:700;${
        buying?'background:var(--up);color:#fff':'background:var(--downT);border:1px solid var(--down);color:var(--down)'}">
        ${n(o.qty)}주 ${buying?'매수':'매도'}</button></div>
  </div></div>`;
}
let sheetKey='';
function renderSheet(){
  const o=U.sheet, key=o? [o.code,o.side,o.qty,o.px,o.market?'m':'l'].join('|') : '';
  if(key===sheetKey) return;
  sheetKey=key;
  sheetEl.innerHTML = o? orderSheet(o) : '';
}

        : `주식이 없으면 매분 들어오는 <b style="color:var(--text)">무상증자를 한 주도 받지 못하고</b>, 인플레로 오르는 값도 못 탑니다.`}</div></div></div></div>
  <div style="display:flex;align-items:center;padding:14px 16px 8px">
    <div class="grow" style="font-size:14px;font-weight:700">종목별 청약 현황</div>
    <div class="m" style="font-size:11px;color:var(--dim2)">예치 ${n(reserved)}</div></div>
  <div style="border-top:1px solid var(--line)">${snap.stocks.map(st=>{
    const demand = st.ipoDemand||0, rate = st.float? demand/st.float : 0, mine = S.myIpoBids[st.code]||0;
    return `<button data-act="ipoPick" data-v="${st.code}" class="row" style="height:56px;width:100%;text-align:left;
      background:${st.code===U.ipoCode?'var(--accT)':'transparent'};border-left:${st.code===U.ipoCode?'2px solid var(--acc)':'2px solid transparent'}">
      ${dot(st.color)}
      <div class="grow"><div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:15px;font-weight:600">${esc(st.name)}</span>
        ${mine?`<span class="badge m" style="background:var(--acc);color:var(--ink)">내 ${n(mine)}주</span>`:''}</div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:2px">초기가 ${n(st.open||st.last)} · 발행 ${n(st.float)}주</div></div>
      <div class="rt"><div class="m" style="font-size:14px;font-weight:600">${n(demand)}주</div>
        <div class="m" style="font-size:11px;font-weight:600;margin-top:2px;color:${rate>=1?'var(--up)':'var(--dim2)'}">청약률 ${rate.toFixed(1)}배</div></div>
    </button>`;}).join('')}</div>
  <div class="sticky">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      ${dot(s.color)}<div class="grow" style="font-size:14px;font-weight:700">${esc(s.name)} 청약</div>
      <div class="m" style="font-size:11px;color:var(--dim2)">기준가 ${n(s.open||s.last)} 미만은 배정 안 됨</div></div>
    <div class="step"><span style="font-size:11px;color:var(--dim2);width:32px">가격</span>
      <span class="v m">${n(U.ipoPrice)}</span>
      <button data-act="ipoP" data-v="-1" aria-label="가격 내림">${iMinus}</button>
      <button data-act="ipoP" data-v="1" aria-label="가격 올림">${iPlus}</button></div>
    <div class="step" style="margin-top:6px"><span style="font-size:11px;color:var(--dim2);width:32px">수량</span>
      <span class="v m">${n(U.ipoQty)}</span>
      <button data-act="ipoQ" data-v="-1" aria-label="수량 줄임">${iMinus}</button>
      <button data-act="ipoQ" data-v="1" aria-label="수량 늘림">${iPlus}</button></div>
    <button class="cta" data-act="ipoBid" style="margin-top:8px">청약하기 · 예치 ${n(U.ipoPrice*U.ipoQty)}원</button></div>`;
}
</script>

<script>
/* ---- 3. 전체 시황 ---- */
function vMarket(snap,me){
  const hasMe = !!S.me;
  const sorted=[...snap.stocks].sort((a,b)=> b.changePct-a.changePct);
  // 순위표는 상위 20명까지만 실려 온다(대역폭). 내가 거기 없으면 내 줄을 따로 붙인다.
  const inTop = hasMe && snap.ranking.some(p=>p.id===me.id);
  return `<div style="padding:14px 16px 0;border-bottom:1px solid var(--line)">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="grow" style="font-size:15px;font-weight:600">${esc(S.title||'모의주식 챌린지')}</div>
      <span class="badge" style="background:var(--upT);color:var(--up);gap:5px;letter-spacing:.06em">
        <span class="dot" style="width:6px;height:6px;background:var(--up)"></span>LIVE</span>
      <span class="m" style="font-size:11px;color:var(--dim2)">접속 ${snap.connections}</span></div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:8px">
      <div class="m" style="font-size:34px;font-weight:700">${clk(snap.remainSec)}</div>
      <div style="font-size:13px;color:var(--dim)">남음</div><div class="grow"></div>
      <div style="font-size:12px;color:var(--dim2)">사람 ${snap.humanCount} · 봇 ${snap.playerCount-snap.humanCount}</div></div>
    <div class="bar" style="margin:12px 0 10px"><i style="width:${Math.min(100,snap.elapsedSec/(CFG.durationMin*60+CFG.ipoSec)*100)}%"></i></div>
    <div style="display:flex;align-items:center;padding-bottom:12px">
      <span style="font-size:11px;color:var(--dim2)" class="grow">월급 ${n(CFG.salaryAmount)}/분 · 인플레 ${(CFG.inflationPerMin*100).toFixed(1)}%/분</span>
      ${isHost()?`<button data-act="pause" data-v="${snap.paused?0:1}" style="height:32px;padding:0 12px;
        border-radius:8px;margin-right:6px;background:${snap.paused?'var(--accT)':'transparent'};
        border:1px solid ${snap.paused?'var(--acc)':'var(--line)'};
        color:${snap.paused?'var(--acc)':'var(--dim2)'};font-size:12px">${snap.paused?'재개':'일시정지'}</button>
      <button data-act="end" style="height:32px;padding:0 12px;border-radius:8px;
        border:1px solid var(--line);color:var(--dim2);font-size:12px">지금 마감</button>`:''}</div></div>
  ${connBanner()}${pausedBanner(snap)}
  ${newsBanner(snap)}
  ${hasMe?`<div class="pad" style="padding-top:14px">
    <div class="card" style="padding:14px 16px 0">
      <div style="display:flex;align-items:center"><div class="grow lbl" style="margin:0">내 총자산</div>
        <span class="badge m" style="background:var(--accT);color:var(--acc)">${me.rank||'-'}위 / ${me.rankTotal}명</span></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">
        <div class="m" style="font-size:28px;font-weight:700">${n(me.nav)}</div>
        <div style="font-size:14px;color:var(--dim)">원</div></div>
      <div style="display:flex;align-items:baseline;gap:7px;margin-top:3px">
        <div class="m" style="font-size:13px;font-weight:600;color:${cl(me.nav-me.invested)}">
          ${sg(me.nav-me.invested)} (${pc(me.nav/me.invested*100-100)})</div>
        <div style="font-size:11px;color:var(--dim2)">누적 투입 ${n(me.invested)} 대비</div></div>
      <div style="height:1px;background:var(--line);margin-top:14px"></div>
      <div style="display:flex;flex-wrap:wrap">
        ${[['현금',n(me.cash),'var(--text)'],['묶인 현금',n(me.lockedCash),'var(--dim)'],
           ['평가금액',n(me.nav-me.cash-me.lockedCash),'var(--text)'],['실현손익',sg(me.realized),cl(me.realized)]]
          .map(([k,v,c])=>`<div style="width:50%;padding:8px 0"><div style="font-size:11px;color:var(--dim2)">${k}</div>
            <div class="m" style="font-size:13px;font-weight:600;color:${c};margin-top:3px">${v}</div></div>`).join('')}</div>
      <div style="height:1px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;padding:10px 0 8px">
        <div class="grow lbl" style="margin:0">분당 정산 · ${salaryCount()}회</div>
        <span class="badge m" style="background:var(--surf3);color:var(--dim)">다음 ${clk(nextSalarySec())}</span></div>
      <div style="display:flex;gap:8px;padding-bottom:12px">
        <div style="flex:1;background:var(--accT);border-radius:10px;padding:10px 12px">
          <div style="font-size:11px;color:var(--dim2)">월급 · ${n(CFG.salaryAmount)}/분</div>
          <div class="m" style="font-size:14px;font-weight:700;color:var(--acc);margin-top:3px">+${n(me.salaryTotal)}</div></div>
        <div style="flex:1;background:var(--accT);border-radius:10px;padding:10px 12px">
          <div style="font-size:11px;color:var(--dim2)">내 보유 주식</div>
          <div class="m" style="font-size:14px;font-weight:700;color:var(--acc);margin-top:3px">${n(me.holdings.reduce((a,h)=>a+h.qty,0))}주</div></div></div>
    </div></div>`:''}

  <div class="pad" style="padding-top:16px;padding-bottom:8px">
    <div style="font-size:14px;font-weight:700">전체 종목 <span style="color:var(--dim2);font-weight:500">${snap.stocks.length}</span>
      <span style="font-size:11px;font-weight:500;color:var(--dim2);margin-left:6px">등락률순</span></div></div>
  <div class="thead"><span class="grow">종목</span><span style="width:84px;text-align:right">현재가 · 등락</span></div>
  <div>${sorted.map(s=>`
    <button data-act="stock" data-v="${s.code}" class="row" style="height:56px;width:100%;text-align:left">
      ${dot(s.color)}
      <div class="grow"><div style="display:flex;align-items:center;gap:6px;min-width:0">
          <span style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span>
          <span class="m" style="font-size:10px;color:var(--dim2);flex-shrink:0">${s.code}</span>
          ${s.issued===0?'<span class="badge" style="background:var(--surf3);color:var(--dim2)">미발행</span>':''}
          ${snap.news.some(nw=>nw.code===s.code)?`<span class="badge" style="background:var(--warnT);color:var(--warn)">뉴스</span>`:''}</div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:3px">적정 ${n(s.fair)} · 거래량 ${n(s.volume)}</div></div>
      <div class="rt" style="width:84px;flex-shrink:0">
        <div class="m" data-flash style="display:inline-block;font-size:16px;font-weight:700;color:${clz(s.changePct)};border-radius:4px;padding:0 3px;margin-right:-3px">${tri(s.changePct)}${n(s.last)}</div>
        <div class="m" style="font-size:12px;font-weight:600;margin-top:2px;color:${clz(s.changePct)}">${pc(s.changePct)}</div></div>
    </button>`).join('')}</div>

  <div class="pad" style="padding-top:16px;padding-bottom:8px">
    <div style="font-size:14px;font-weight:700">사람 순위 <span style="color:var(--dim2);font-weight:500;font-size:11px">봇 제외 · 누적 투입 대비 · 상위 ${snap.ranking.length}명</span></div></div>
  <div style="border-top:1px solid var(--line)">${snap.ranking.map(p=>rankRow(p, hasMe&&p.id===me.id)).join('')}
    ${(hasMe&&!inTop&&me.rank)?rankRow({rank:me.rank,name:me.name,nav:me.nav,
        pnl:me.nav-me.invested,pnlPct:me.nav/me.invested*100-100}, true):''}</div>
  <div style="height:20px"></div>
  ${bottomNav('market')}`;
}
function rankRow(p,mine){
  return `<div class="row" style="height:56px;background:${mine?'var(--accT)':'transparent'};
    border-left:${mine?'2px solid var(--acc)':'2px solid transparent'}">
    <div class="m" style="width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:700;background:${p.rank===1?'var(--acc)':'var(--surf3)'};
      color:${p.rank===1?'var(--ink)':'var(--dim)'}">${p.rank}</div>
    <div class="grow" style="display:flex;align-items:center;gap:7px">
      <span style="font-size:14px;font-weight:${mine?700:500}">${esc(p.name)}</span>
      ${mine?'<span class="badge" style="background:var(--acc);color:var(--ink)">나</span>':''}</div>
    <div class="rt"><div class="m" style="font-size:14px;font-weight:600">${n(p.nav)}</div>
      <div class="m" style="font-size:11px;font-weight:600;margin-top:1px;color:${p.pnlPct===0?'var(--dim2)':cl(p.pnlPct)}">${pc(p.pnlPct)}</div></div>
  </div>`;
}

/* ---- 4. 개별 종목 ---- */
function vStock(snap,me){
  const s=stockOf(U.code)||snap.stocks[0];
  if(!s) return '';
  const hasMe=!!S.me, trading=snap.phase==='trading';
  if(!U.qty) U.qty=CFG.lotSize;
  const hold=me.holdings.find(h=>h.code===s.code);
  const myOrders=me.openOrders.filter(o=>o.code===s.code);
  const tick=tickSize(s.last);
  // 수량 상한은 서버가 계산해서 준다(me.tradable).
  const tr=me.tradable.find(t=>t.code===s.code)||{maxBuyQty:0,maxSellQty:0};
  // 주문은 전부 지정가다. 가격은 현재가로 시작해 따라가다가, 호가를 누르거나 ± 를 누르면 그 값에 고정된다.
  if(!U.pxPinned||U.px==null) U.px=s.last;
  const px=U.px;
  const buying=U.side!=='sell';
  const maxBuy=floorLot(me.cash/(px*(1+CFG.feeRate)));
  const maxSell=tr.maxSellQty;
  // 비율 칩과 '최대' 는 고른 쪽만 본다 — 매수 한도로 매도를 시도하던 혼선을 없앤다.
  const cap=buying?maxBuy:maxSell;
  if(U.qty>cap) U.qty=cap;               // 방향을 바꾸면 수량도 그쪽 한도로 맞춘다
  // 내 미체결 주문을 호가 옆에 표시한다. 매도는 왼쪽(매도 잔량 쪽), 매수는 오른쪽에.
  const mineBuy={}, mineSell={};
  for(const o of myOrders){ const m=o.side==='buy'?mineBuy:mineSell; m[o.price]=(m[o.price]||0)+o.qty; }
  const mineTag=q=>q?`<span class="badge m" style="position:relative;background:var(--acc);color:var(--ink);flex-shrink:0">내 ${n(q)}</span>`:'';
  const maxQ=Math.max(1,...s.depth.bids.map(d=>d.qty),...s.depth.asks.map(d=>d.qty));
  const qmap=arr=>Object.fromEntries(arr.map(d=>[d.price,d.qty]));
  const ask=qmap(s.depth.asks), bid=qmap(s.depth.bids);
  const priceCell=(p,side,best)=>{ const sel=U.pxPinned&&U.px===p, hiBg=side==='a'?'var(--downT)':'var(--upT)', hiLn=side==='a'?'var(--down)':'var(--up)';
    return `<button data-act="px" data-v="${p}" class="pcell" aria-pressed="${sel}" aria-label="${n(p)}원으로 주문"
      style="background:${sel?'var(--accT)':best?hiBg:'var(--surf)'};
      border-left:1px solid ${sel?'var(--acc)':best?hiLn:'var(--line)'};border-right:1px solid ${sel?'var(--acc)':'var(--line)'}">
      <span class="m" style="font-size:14px;font-weight:${best||sel?700:600};color:${sel?'var(--acc)':side==='a'?'var(--down)':'var(--up)'}">${n(p)}</span></button>`; };
  // 사다리는 실제 호가창의 최우선 매수/매도호가에서 시작한다. 현재가(last) 기준으로 합성하면
  // 현재가보다 위에 있는 매수호가가 보이지 않아, 1,140 에 판다고 생각한 주문이 1,170 에 체결되는 걸
  // 화면이 설명하지 못했다. 최우선 호가가 없는 쪽은 반대편에서 한 호가 떨어진 곳부터 그린다.
  const up=p=>roundTick(p+tickSize(p)), down=p=>Math.max(tickSize(p), roundTick(p-tickSize(p)));
  const hasA=s.depth.asks.length>0, hasB=s.depth.bids.length>0;
  const bestBid = hasB? s.depth.bids[0].price : (hasA? down(s.depth.asks[0].price) : s.last);
  const bestAsk = hasA? s.depth.asks[0].price : up(bestBid);
  const askRows=[], bidRows=[];
  for(let p=bestAsk,i=0;i<10;i++){ askRows.push(p); p=up(p); }
  for(let p=bestBid,i=0;i<10&&p>0;i++){ bidRows.push(p); const q=down(p); if(q===p) break; p=q; }
  let ladder='';
  for(let i=askRows.length-1;i>=0;i--){ const p=askRows[i], q=ask[p];
    ladder+=`<div class="depthrow">
      <span class="qcell a">${mineTag(mineSell[p])}${q?`<span class="qbar" style="right:0;width:${q/maxQ*100}%;background:var(--downT)"></span>
        <span class="m" style="position:relative;font-size:13px;color:var(--dim)">${n(q)}</span>`:''}</span>
      ${priceCell(p,'a',i===0&&hasA)}<span class="qcell b">${mineTag(mineBuy[p])}</span></div>`; }
  ladder+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;height:24px;
    background:var(--surf2);border-bottom:1px solid var(--line)">
    <span style="font-size:10px;color:var(--dim2)">스프레드</span>
    <span class="m" style="font-size:11px;font-weight:600;color:var(--dim)">${hasA&&hasB? n(bestAsk-bestBid)+'원':'—'}</span></div>`;
  for(let i=0;i<bidRows.length;i++){ const p=bidRows[i], q=bid[p];
    ladder+=`<div class="depthrow">
      <span class="qcell a">${mineTag(mineSell[p])}</span>${priceCell(p,'b',i===0&&hasB)}
      <span class="qcell b">${q?`<span class="qbar" style="left:0;width:${q/maxQ*100}%;background:var(--upT)"></span>
        <span class="m" style="position:relative;font-size:13px;color:var(--dim)">${n(q)}</span>`:''}
        ${mineTag(mineBuy[p])}</span></div>`; }

  const tp=(snap.tape||[]).filter(t=>t.code===s.code), fills=tp.slice(-14).reverse();
  const askTot=s.depth.asks.reduce((a,d)=>a+d.qty,0), bidTot=s.depth.bids.reduce((a,d)=>a+d.qty,0), tot=askTot+bidTot||1;
  // 체결강도 = 최근 체결의 매수 체결량 / 매도 체결량. 100% 위면 사는 쪽이 더 세다.
  const bv=tp.filter(t=>t.side==='buy').reduce((a,t)=>a+t.qty,0), sv=tp.filter(t=>t.side==='sell').reduce((a,t)=>a+t.qty,0);
  const strength=Math.min(999, sv? bv/sv*100 : (bv? 999 : 100));
  const strengthTxt=(sv||bv)? (sv? strength.toFixed(0)+'%' : '999%+') : '—';
  const body = U.tab==='호가' ? `
    <div class="thead" style="gap:0;border-top:none;margin-top:8px">
      <span style="flex:1;text-align:right;padding-right:12px;color:var(--down)">매도 잔량</span>
      <span style="flex:0 0 104px;text-align:center">호가 10단계</span>
      <span style="flex:1;padding-left:12px;color:var(--up)">매수 잔량</span></div>
    <div class="pad">${ladder}
      <div class="obtot"><span class="m rt" style="color:var(--down)">${n(askTot)}</span><span class="c">잔량 합계</span>
        <span class="m" style="color:var(--up)">${n(bidTot)}</span></div>
      <div class="ratio" style="margin-top:10px"><i style="width:${askTot/tot*100}%;background:var(--down)"></i><i style="width:${bidTot/tot*100}%;background:var(--up)"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--dim2)">
        <span>매도 ${(askTot/tot*100).toFixed(0)}%</span>
        <span>체결강도 <b class="m" style="color:${strength>=100?'var(--up)':'var(--down)'}">${strengthTxt}</b></span>
        <span>매수 ${(bidTot/tot*100).toFixed(0)}%</span></div></div>`
  : U.tab==='차트' ? `
    <div class="pad" style="padding-top:10px"><canvas id="chart"></canvas></div>`
  : `<div class="sec" style="padding:14px 16px 8px"><h2 style="font-size:12px;color:var(--dim)">최근 체결 <small>${fills.length}건</small></h2>
      <span class="meta">체결강도 <b class="m" style="color:${strength>=100?'var(--up)':'var(--down)'}">${strengthTxt}</b></span></div>
    <div class="thead"><span style="width:52px">시간</span><span class="grow">체결가 · 시초가 대비</span>
      <span style="width:70px;text-align:right">체결량</span><span style="width:34px;text-align:right">구분</span></div>
    <div>${fills.length?fills.map(t=>`
      <div class="row" style="height:38px"><span class="m" style="width:52px;font-size:11px;color:var(--dim2)">+${clk(t.t)}</span>
        <span class="grow m" style="font-size:13px;font-weight:600;color:${t.side==='buy'?'var(--up)':'var(--down)'}">${n(t.price)}<span
          style="font-size:10px;font-weight:500;color:var(--dim2);margin-left:6px">${s.open?pc((t.price/s.open-1)*100):''}</span></span>
        <span class="m" style="width:70px;text-align:right;font-size:12px;color:var(--dim)">${n(t.qty)}주</span>

/* 차트는 GET /api/rooms/{code}/chart 의 history 를 그린다 (1초에 한 점, 최대 1800점). */
function drawChart(){
  const c=document.getElementById('chart'); if(!c) return;
  const s=stockOf(U.code); if(!s) return;
  const hs=(S.chart.code===U.code? S.chart.rows : []) || [];
  const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=200;
  // width 를 쓰는 순간 비트맵이 비워진다. 크기가 그대로면 다시 쓰지 않고, 변환은 누적되지 않게 setTransform 으로 건다.
  const W=Math.round(w*dpr), H=Math.round(h*dpr);
  if(c.width!==W||c.height!==H){ c.width=W; c.height=H; }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  if(hs.length<2){
    g.fillStyle='#5C6472'; g.font='500 12px "IBM Plex Sans KR",sans-serif'; g.textAlign='center';
    g.fillText('이력을 모으는 중…',w/2,h/2); return;
  }
  const lo=Math.min(...hs.map(p=>p.price))*0.99,
        hi=Math.max(...hs.map(p=>p.price))*1.01;
  const RM=48, T=8, B=18, pw=w-RM;
  const X=i=>i/(hs.length-1)*pw, Y=v=>(hi-v)/(hi-lo||1)*(h-T-B)+T;
  // 격자와 눈금 — 실제 HTS 처럼 오른쪽에 가격, 아래에 시간을 단다.
  g.font='500 9px "IBM Plex Mono",monospace'; g.textBaseline='middle'; g.textAlign='right';
  for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, y=Y(v);
    g.strokeStyle='#1C2129'; g.lineWidth=1; g.beginPath(); g.moveTo(0,y); g.lineTo(pw,y); g.stroke();
    g.fillStyle='#5C6472'; g.fillText(n(Math.round(v)),w-2,y); }
  g.textBaseline='alphabetic'; g.textAlign='left'; g.fillStyle='#5C6472';
  g.fillText('+'+clk(hs[0].t||0),0,h-4); g.textAlign='right'; g.fillText('+'+clk(hs[hs.length-1].t||0),pw,h-4);
  // 시초가 기준선
  g.strokeStyle='#2E3540'; g.lineWidth=1; g.setLineDash([2,3]); g.beginPath();
  g.moveTo(0,Y(s.open)); g.lineTo(pw,Y(s.open)); g.stroke(); g.setLineDash([]);
  // 체결가 아래 면적 — 시초가보다 위면 붉게, 아래면 푸르게
  const upc=s.last>=s.open, grad=g.createLinearGradient(0,T,0,h-B);
  grad.addColorStop(0, upc?'rgba(255,77,94,.22)':'rgba(76,141,255,.22)'); grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad; g.beginPath(); g.moveTo(X(0),h-B);
  hs.forEach((p,i)=>g.lineTo(X(i),Y(p.price))); g.lineTo(X(hs.length-1),h-B); g.closePath(); g.fill();
  g.strokeStyle=upc?'#FF4D5E':'#4C8DFF'; g.lineWidth=1.8;
  g.lineJoin='round'; g.beginPath();
  hs.forEach((p,i)=>i?g.lineTo(X(i),Y(p.price)):g.moveTo(X(i),Y(p.price))); g.stroke();
  g.font='600 10px "IBM Plex Mono",monospace'; g.textBaseline='middle'; g.textAlign='left';
  const pill=(v,y,bg,fg)=>{const t=n(v),tw=g.measureText(t).width+10;
    g.fillStyle=bg; g.beginPath(); g.roundRect(w-tw-2,y-9,tw,18,4); g.fill();
    g.fillStyle=fg; g.fillText(t,w-tw+3,y);};
  pill(s.last,Y(s.last),upc?'#FF4D5E':'#4C8DFF','#fff');
}

        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:4px">${n(h.qty)}주 · 평단 ${n(h.avgPrice)} → ${n(h.last)}</div></div>
      <div class="rt"><div class="m" style="font-size:15px;font-weight:700">${n(h.evalAmount)}</div>
        <div class="m" style="font-size:12px;font-weight:600;margin-top:3px;color:${cl(h.pnl)}">${sg(h.pnl)} · ${pc(h.pnlPct)}</div></div>
    </button>`;}).join('')}</div>`
  : `<div class="pad"><div class="card" style="padding:24px 20px;text-align:center">
      <div style="font-size:14px;font-weight:600;color:var(--dim)">보유한 주식이 없습니다</div>
      <div style="font-size:12px;color:var(--dim2);line-height:1.6;margin-top:8px">
        ${CFG.maxBonusRate>0? '주식이 없으면 매분 들어오는 무상증자를 한 주도 받지 못합니다.' : '주식이 없으면 뉴스와 인플레로 오르는 값을 못 탑니다.'}<br>시황에서 종목을 골라 매수해 보세요.</div>
      <button data-act="go" data-v="market" class="cta" style="height:48px;margin-top:16px">시황으로</button></div></div>`}

  <div class="pad" style="padding-top:16px;padding-bottom:8px">
    <div style="display:flex;align-items:center">
      <div class="grow" style="font-size:14px;font-weight:700">미체결 주문
        <span style="color:var(--dim2);font-weight:500">${me.openOrders.length}</span></div>
      ${me.lockedCash?`<div class="m" style="font-size:11px;color:var(--dim2)">묶인 현금 ${n(me.lockedCash)}</div>`:''}</div></div>
  ${me.openOrders.length? `<div style="border-top:1px solid var(--line)">${me.openOrders.map(o=>`
    <div class="row" style="height:64px">
      <div class="grow"><div style="display:flex;align-items:center;gap:6px">
          <span class="badge" style="background:${o.side==='buy'?'var(--upT)':'var(--downT)'};color:${o.side==='buy'?'var(--up)':'var(--down)'}">${o.side==='buy'?'매수':'매도'}</span>
          ${dot((stockOf(o.code)||{}).color,8)}<span style="font-size:14px;font-weight:600">${esc(o.name)}</span></div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:4px">${n(o.price)} × ${n(o.qty)}주 = ${n(o.price*o.qty)}원</div></div>
      <button data-act="cancel" data-v="${o.id}" data-c="${o.code}" style="height:44px;padding:0 14px;border-radius:10px;
        border:1px solid var(--line2);color:var(--dim);font-size:13px;font-weight:600">취소</button></div>`).join('')}</div>`
  : `<div class="pad"><div style="font-size:12px;color:var(--dim2);padding:4px 2px 0">걸어둔 주문이 없습니다.</div></div>`}
  <div style="height:20px"></div>
  ${bottomNav('assets')}`;
}
</script>

<script>
/* ---- 라우터 ---- */
function go(v){ U.view=v; if(v==='stock') U.tab='호가'; toTop(); renderNow(); }

/* ---- 그리기 -------------------------------------------------------------
   화면은 SSE 푸시마다(기본 400ms) 다시 그려진다. 예전에는 view.innerHTML 을 통째로
   갈아끼웠는데, 그러면 두 가지가 깨진다. 실측한 값이다.

     · 누르고 있던 버튼이 DOM 에서 떨어져 탭이 씹힌다 — 0.6초 누르고 떼기 6회 중 6회 실패.
     · 스크롤을 되살리려고 저장해 둔 scrollTop 을 되쓰는데, 그 사이 사용자가 더 스크롤하면
       위치가 뒤로 끌린다 — 표본 230개 중 230개에서 어긋났다.

   그래서 새 HTML 을 화면 밖에서 만들어 두고, 기존 DOM 과 견주어 달라진 자리만 고친다.
   버튼과 스크롤 컨테이너가 그대로 살아 있으므로 탭도 스크롤도 방해받지 않는다.
   (CPU 4배 스로틀에서 통째 교체는 1회 33ms 였다.) */

const scratch = document.createElement('div');

/* 화면을 옮기면 맨 위에서 시작해야 한다. 스크롤하는 건 문서이므로 #view 의 scrollTop 을
   건드려도 아무 일도 일어나지 않는다(항상 0 이다). */
function toTop(){
  const doc = document.scrollingElement || document.documentElement;
  if (doc.scrollTop) doc.scrollTop = 0;
}

/* 값이 바뀐 칸을 잠깐 물들인다 — 실제 HTS 의 체결 반짝임. data-flash 가 달린 요소의 숫자 텍스트가
   오르면 붉게, 내리면 푸르게. data-fl 은 patchAttrs 가 지우지 않고 타이머로 걷는다. */
function flash(el,a,b){
  const num=x=>Number(String(x).replace(/[^\d.-]/g,''));
  const x=num(a), y=num(b);
  if(!isFinite(x)||!isFinite(y)||x===y) return;
  el.removeAttribute('data-fl'); void el.offsetWidth;    // 같은 방향이 연달아 와도 애니메이션이 다시 돈다
  el.setAttribute('data-fl', y>x?'up':'down');
  clearTimeout(el._fl); el._fl=setTimeout(()=>el.removeAttribute('data-fl'),650);
}
function patchAttrs(live,next){
  for(const a of Array.from(next.attributes))
    if(live.getAttribute(a.name)!==a.value) live.setAttribute(a.name,a.value);
  for(const a of Array.from(live.attributes))
    if(!next.hasAttribute(a.name)&&a.name!=='data-fl') live.removeAttribute(a.name);
}
function patchEl(live,next){
  if(live.nodeName!==next.nodeName){ live.replaceWith(next); return; }
  // 캔버스는 자바스크립트로 직접 그린다. drawChart 가 붙인 width/height 속성이 템플릿에는 없어서
  // 여기서 지워 버리면 비트맵이 초기화돼 다음 그리기까지 빈 화면이 된다 — 차트가 깜빡이던 원인이다.
  // 속성도 자식도 건드리지 않는다.
  if(live.nodeName==='CANVAS') return;
  patchAttrs(live,next);
  // 입력 중인 칸은 값도 캐럿도 건드리지 않는다.
  if(live===document.activeElement&&(live.nodeName==='INPUT'||live.nodeName==='TEXTAREA')) return;
  patchKids(live,next);
}
function patchKids(live,next){
  const kids=Array.from(next.childNodes);        // appendChild 로 옮겨도 순회가 깨지지 않게 미리 뜬다
  for(let i=0;i<kids.length;i++){
    const n=kids[i], l=live.childNodes[i];
    if(!l){ live.appendChild(n); continue; }
    if(l.nodeType!==n.nodeType||l.nodeName!==n.nodeName){ l.replaceWith(n); continue; }
    if(n.nodeType===1){ patchEl(l,n); continue; }
    if(l.nodeValue!==n.nodeValue){                              // 텍스트·주석
      const pe=l.parentNode;
      if(pe&&pe.nodeType===1&&pe.hasAttribute('data-flash')) flash(pe,l.nodeValue,n.nodeValue);
      l.nodeValue=n.nodeValue; }
  }
  while(live.childNodes.length>kids.length) live.removeChild(live.lastChild);
}

function viewHtml(){
  const snap=S.snap, me=S.me||EMPTY_ME;
  if(U.view==='home')       return vHome();
  if(U.view==='join')       return vJoin();
  if(U.view==='setup')      return vSetup();
  if(U.view==='lobby')      return vLobby();
  if(!snap)                 return vHome();
  if(U.view==='ipo')        return vIpo(snap,me);
  if(U.view==='stock')      return vStock(snap,me);
  if(U.view==='assets')     return vPortfolio(snap,me);
  if(U.view==='result')     return vResult(snap);
  return vMarket(snap,me);
}

let lastHtml=null, lastView=null, rafPending=0, chartKey=null, chartEl=null;

function paint(){
  rafPending=0;
  const html=viewHtml();
  if(U.view!==lastView){        // 화면이 통째로 바뀔 때는 남길 게 없다 — 그대로 새로 깐다
    lastView=U.view; lastHtml=html;
    view.innerHTML=html;
    toTop();
  }else if(html!==lastHtml){    // 값이 하나도 안 바뀌면 DOM 을 만지지 않는다
    lastHtml=html;
    scratch.innerHTML=html;
    patchKids(view,scratch);
  }
  renderPaused(S.snap);
  renderSheet();
  if(U.view==='stock'&&U.tab==='차트'){
    // 캔버스는 살아남으므로 그림이 실제로 달라질 때만 다시 그린다.
    const s=stockOf(U.code), c=document.getElementById('chart');
    const key=`${U.code}|${S.chart.rows.length}|${s?s.last:0}|${view.clientWidth}`;
    // 캔버스 요소가 새로 생겼으면(탭 전환·DOM 교체) 값이 같아도 다시 그린다 — 빈 캔버스가 한 프레임만 보여도 깜빡임이다.
    if(key!==chartKey||c!==chartEl){ chartKey=key; chartEl=c; drawChart(); }
  }else{ chartKey=null; chartEl=null; }
}

/* 한 프레임에 푸시가 여러 번 와도 그리는 건 한 번이면 된다. */
function render(){ if(!rafPending) rafPending=requestAnimationFrame(paint); }

/* 화면을 옮길 때는 기다리지 않고 바로 그린다 — 탭을 눌렀는데 한 프레임 비는 게 보인다. */
function renderNow(){
  if(rafPending){ cancelAnimationFrame(rafPending); rafPending=0; }
  paint();
}

// 차트 이력은 스냅샷에 실려 오지 않는다(크기). 보고 있는 동안만 따로 받아 온다.
setInterval(()=>{ if(U.view==='stock'&&U.tab==='차트'&&U.code) loadChart(U.code); }, 2000);

/* ---- 입력 ---- */
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&U.sheet){ U.sheet=null; U.skipNext=false; renderSheet(); } });
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-in]'); if(!el) return;
  U[el.dataset.in]=el.value;              // 다시 그리면 포커스가 날아가므로 여기서는 render 하지 않는다
});

async function busy(fn){
  if(U.busy) return;
  U.busy=true; renderNow();
  try{ await fn(); }
  catch(e){ toastErr(e); }
  finally{ U.busy=false; renderNow(); }
}

/** 지금 고른 방향(U.side)으로 낼 수 있는 최대 수량. 화면과 버튼이 같은 값을 본다. */
function tradeCap(){
  const me=S.me||EMPTY_ME, st=stockOf(U.code);
  const t=me.tradable.find(x=>x.code===U.code)||{maxBuyQty:0,maxSellQty:0};
  if(U.side==='sell') return t.maxSellQty;
  if(!st) return 0;
  if(U.px!=null) return floorLot(me.cash/(U.px*(1+CFG.feeRate)));       // 지정가는 그 가격으로 센다
  return Math.min(t.maxBuyQty, floorLot(me.cash/(st.last*(1+CFG.feeRate))));
}

async function submitOrder(code,side,price,qty,market){
  const r = await api('POST', R('/orders'), {code, side, qty, price: market? 'market' : price});
  // 체결 토스트가 "지정가 X → Y 체결" 을 적을 수 있게 방금 낸 가격을 기억한다(60초).
  S.lastPx = S.lastPx || {};
  if(market) delete S.lastPx[code+'|'+side]; else S.lastPx[code+'|'+side] = {px:Number(price), t:Date.now()};
  // 시장가는 반대편 호가에 있는 만큼만 체결하고 남은 수량은 취소한다(IOC). 지정가가 없는
  // 화면에서 수량이 조용히 줄어들면 참가자는 이유를 알 수 없으므로 그때만 따로 알린다.
  if(market && r.filled>0 && r.filled<qty){
    const st=stockOf(code);
    showToast(`<div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
        justify-content:center;background:var(--warnT)">${svg(iInfo,18,'var(--warn)',1.6)}</div>
      <div class="grow"><div style="font-size:13px;font-weight:700">${n(r.filled)}주만 체결됐습니다</div>
        <div style="font-size:11px;color:var(--dim2);margin-top:2px">${esc(st?st.name:code)} ${side==='buy'?'매도':'매수'} 호가에
          ${n(qty-r.filled)}주가 부족해 나머지는 취소했습니다</div></div></div>`, 4200);
  }
  // 지정가는 남은 수량이 호가창에 걸린다. 체결 토스트만 보면 "왜 일부만 됐지" 싶으니 접수 사실을 알린다.
  if(!market && r.resting>0){
    const st=stockOf(code);
    showToast(`<div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
        justify-content:center;background:var(--accT)">${svg('M4 12.5l5 5L20 6.5',17,'var(--acc)',2)}</div>
      <div class="grow"><div style="font-size:13px;font-weight:700">${side==='buy'?'매수':'매도'} 주문 접수 · ${esc(st?st.name:code)}</div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:2px">지정가 ${n(price)} · 즉시 체결 ${n(r.filled)}주 · 대기 ${n(r.resting)}주</div></div></div>`, 3600);
  }
  return r;
}

document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, k=b.dataset.k;
  const me=S.me||EMPTY_ME;

  if(a==='closeToast')  return closeToast(v);
  if(a==='closeToasts') return closeAllToasts();
  // 주문 확인 시트. 배경(.sheetbg) 자체를 눌렀을 때만 닫고, 시트 안쪽 빈 곳은 통과시킨다.
  if(a==='closeSheet'){ if(b.classList.contains('sheetbg')&&e.target!==b) return;
    U.sheet=null; U.skipNext=false; return renderSheet(); }
  if(a==='skipConfirm'){ U.skipNext=!!b.checked; return; }
  if(a==='togConfirm'){ U.confirmOn=!U.confirmOn; lsSet('confirm',U.confirmOn); return renderNow(); }
  if(a==='confirmOrder'){
    const o=U.sheet; if(!o) return;
    if(U.skipNext){ U.confirmOn=false; lsSet('confirm',false); U.skipNext=false; }
    U.sheet=null; renderSheet();
    return busy(async()=>{
      const r=await submitOrder(o.code, o.side, o.market?null:o.px, o.qty, o.market);
      if(o.market&&!r.filled) toastErr({code:'NOT_FILLED',message:'체결되지 않았습니다'});
    });
  }
  // 토스트 안에서 뭔가를 실행했으면 그 팝업은 할 일을 다 했으므로 닫는다.
  const fromToast=b.closest('.toast');
  if(fromToast) closeToast(fromToast.dataset.toast);

  if(a==='set'){ const num=!isNaN(Number(v))&&k!=='tab'&&k!=='sort'&&k!=='side';
    U[k]= num? Number(v) : v;
    if(k==='tab'&&v==='차트'){ loadChart(U.code); setTimeout(drawChart,0); } }
  else if(a==='tog'){ U.codes = U.codes.includes(v)? U.codes.filter(c=>c!==v) : [...U.codes,v]; }
  else if(a==='go'){ return go(v); }
  else if(a==='goJoin'){ return go('join'); }

  else if(a==='join'){
    if(!U.joinCode.trim()) return toastErr({code:'NO_CODE',message:'참가코드를 넣어주세요'});
    return busy(async()=>{ await joinRoom(U.joinCode, U.name); U.view='lobby'; });
  }
  else if(a==='create'){
    if(U.codes.length<2) return;
    return busy(async()=>{
      await createRoom({stockCodes:U.codes, durationMin:U.dur, ipoSec:U.ipoSec,
                        seedMoney:U.seed, botCount:U.bots}, U.title||'모의주식 챌린지', U.name);
      U.view='lobby';
    });
  }
  else if(a==='start'){ return busy(async()=>{ await api('POST', R('/start')); }); }
  else if(a==='end'){   return busy(async()=>{ await api('POST', R('/end')); }); }
  else if(a==='pause'){ return busy(async()=>{ await api('POST', R(v==='1'?'/pause':'/resume-game')); }); }
  else if(a==='leave'){ forget(); U.view='home'; return renderNow(); }
  else if(a==='again'){
    const prev=Object.assign({}, (S.lobby&&S.lobby.config)||{});
    delete prev.seed;                      // 같은 시드를 물려주면 똑같은 판이 그대로 재현된다
    const name=S.myName, title=S.title;
    return busy(async()=>{ forget(); await createRoom(prev,title,name); U.view='lobby'; });
  }

  else if(a==='ipoPick'){ U.ipoCode=v; U.ipoPrice=0; U.ipoQty=0; }
  else if(a==='ipoP'){ U.ipoPrice=Math.max(tickSize(U.ipoPrice),roundTick(U.ipoPrice+Number(v)*tickSize(U.ipoPrice))); }
  else if(a==='ipoQ'){ U.ipoQty=Math.max(CFG.lotSize,U.ipoQty+Number(v)*CFG.lotSize); }
  else if(a==='ipoBid'){
    const code=U.ipoCode, price=U.ipoPrice, qty=U.ipoQty;
    return busy(async()=>{
      const r=await api('POST', R('/ipo-bids'), {code, price, qty});
      S.myIpoBids[r.code]=(S.myIpoBids[r.code]||0)+r.qty;
      const st=stockOf(r.code);
      showToast(`<div style="font-size:13px;font-weight:700">청약 접수 · ${esc(st?st.name:r.code)}</div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:3px">${n(r.price)} × ${n(r.qty)}주 · 증거금 ${n(r.reserved)}원 예치</div>`,2600);
    });
  }

  else if(a==='stock'){ const st=stockOf(v); if(!st) return;
    U.code=v; U.qty=CFG.lotSize; U.px=null; U.pxPinned=false; return go('stock'); }
  // 호가 선택 — 그 가격에 고정된다. ± 는 한 호가씩 옮기고 역시 고정한다. 종목을 바꾸면 다시 현재가를 따라간다.
  else if(a==='px'){ U.px=Number(v); U.pxPinned=true; }
  else if(a==='pxStep'){ const st=stockOf(U.code); if(!st) return;
    const base=U.px==null? st.last : U.px, t=tickSize(base);
    U.px=Math.max(t, roundTick(base+Number(v)*t)); U.pxPinned=true; }
  else if(a==='pxClear'){ U.pxPinned=false; }
  else if(a==='q'){ U.qty=Math.min(tradeCap(), Math.max(CFG.lotSize, U.qty+Number(v)*CFG.lotSize)); }
  else if(a==='ratio'){
    // 고른 방향의 한도에서만 센다. 매수 한도로 매도를 시도하던 혼선이 여기서 났다.
    const cap=tradeCap(), q=floorLot(cap*Number(v)/100);
    U.qty = q>0 ? q : (cap>=CFG.lotSize ? CFG.lotSize : 0); }

  else if(a==='newsBuy'||a==='newsSell'){
    const st=stockOf(v); if(!st) return;
    const t=me.tradable.find(x=>x.code===v)||{maxBuyQty:0,maxSellQty:0};
    const buy=a==='newsBuy';
    const cap=buy? Math.min(t.maxBuyQty, floorLot(me.cash/(st.last*(1+CFG.feeRate)))) : t.maxSellQty;
    const qty=Math.max(CFG.lotSize, floorLot(cap*0.5));
    if(cap<CFG.lotSize) return toastErr({code:buy?'INSUFFICIENT_CASH':'INSUFFICIENT_SHARES',
      message:buy?'현금이 부족합니다':'보유 주식이 부족합니다'});
    return busy(async()=>{ await submitOrder(v, buy?'buy':'sell', null, qty, true); });
  }
  else if(a==='cancel'){
    const code=b.dataset.c, id=v;
    return busy(async()=>{ await api('POST', R('/orders/cancel'), {code, orderId:id}); });
  }
  else if(a==='order'){
    const code=U.code, side=U.side, qty=U.qty, st=stockOf(code);
    if(qty<CFG.lotSize||!st) return;
    // 실제 HTS 처럼 확인창을 한 번 거친다. 끌 수 있고, 뉴스 토스트의 '바로 매수' 는 거치지 않는다.
    const px=(U.pxPinned&&U.px!=null)? U.px : st.last;   // 주문은 전부 지정가다
    if(U.confirmOn){ U.sheet={code, side, qty, px, market:false}; U.skipNext=false; return renderSheet(); }
    return busy(async()=>{ await submitOrder(code, side, px, qty, false); });
  }
  renderNow();
});

boot();
</script>
