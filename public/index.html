<style>
  :root{
    --bg:#0A0C10; --surf:#12151B; --surf2:#191D25; --surf3:#20252E;
    --line:#242A34; --line2:#2E3540;
    --text:#EDEFF3; --dim:#8B93A1; --dim2:#5C6472;
    --up:#FF4D5E; --down:#4C8DFF; --acc:#C6F24E; --warn:#F5A524; --ink:#0A0C10;
    --upT:rgba(255,77,94,.13); --downT:rgba(76,141,255,.13);
    --accT:rgba(198,242,78,.10); --warnT:rgba(245,165,36,.13);
    --sans:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}

  .m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);

  .hdr{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px 0 6px;

  .cta[disabled]{background:var(--surf3);color:var(--dim2)}

  .hint{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--dim2);line-height:1.55;margin-top:9px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .badge{height:20px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;display:inline-flex;align-items:center}
  .row{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}

                border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:600}

               color:var(--dim2);font-size:14px;font-weight:500}

  .bar{height:3px;border-radius:2px;background:var(--surf3);display:flex;overflow:hidden}

  canvas{display:block;width:100%;height:200px}

  /* 좌우 잔량 셀은 같은 폭이어야 막대 길이를 비교할 수 있다. 고정폭은 375px 폰에서 넘치므로 flex 로 나눈다. */

<div id="app">
  <div id="view" class="scroll"></div>

<script>
/* ============================================================================
   더미 API — 서버(claude/dreamy-knuth-bgjjrp) 응답 모양을 그대로 흉내 낸다.
   화면은 API.snapshot() / API.me() 만 읽으므로, 진짜 서버로 바꿀 때는
   이 블록만 fetch + EventSource 로 갈아끼우면 된다.  (SWAP POINT 주석 참고)
   ========================================================================= */
const CFG = {
  seedMoney:1000000, salaryAmount:100000, salaryIntervalSec:60, inflationPerMin:0.005,
  maxBonusRate:0.05, idioVolatility:0.30, durationMin:15, ipoSec:45, tickMs:250,
  lotSize:10, feeRate:0.0015, floatCapitalRatio:0.60, botCount:30,
  botExcludeFromRanking:true, botActionRate:0.035, makerSpread:0.006, lookbackSec:120,
  botMix:{trend:.60, maker:.20, noise:.15, contra:.03, value:.02},
  news:{enabled:true, intervalSec:70, maxActive:3, positiveRatio:0.5, impact:0.07,
        strength:0.06, negativeMultiplier:4.5, reactionSec:40, lifeSec:90},
};
const NEWS_POS=['{n} 대량 매수 유입 — 매도 호가 공백','{n} 동문 매수세 결집','{n} 신고가 경신 — 추격 매수 확산',
  '{n} 기관 순매수 전환','{n} 유통 물량 급감 — 품절주 조짐','{n} 목표가 상향 리포트 발간',
  '{n} 거래량 폭증 — 상승 탄력 확대','{n} 저평가 매력 부각','{n} 응원단 출정 — 개인 매수 유입','{n} 대규모 단체 매수 소문'];
const NEWS_NEG=['{n} 차익실현 매물 출회','{n} 대량 매도 물량 감지','{n} 투자심리 위축 — 매수 관망',
  '{n} 고평가 부담 확대','{n} 목표가 하향 리포트 발간','{n} 거래량 급감 — 매수세 실종',
  '{n} 단기 급등 피로 누적','{n} 손절 물량 확산','{n} 상승분 반납 — 눈치보기 장세','{n} 대기 매물 부담'];
const POOL = [
  {code:'SNU',name:'서울대',initialPrice:1200,color:'#1b3f7a'},
  {code:'YON',name:'연세대',initialPrice:2500,color:'#0a2d5e'},
  {code:'KOR',name:'고려대',initialPrice:3400,color:'#8b1a2b'},
  {code:'HYU',name:'한양대',initialPrice:1800,color:'#0f4c81'},
  {code:'DGU',name:'동국대',initialPrice:900, color:'#d4870c'},
  {code:'KKU',name:'건국대',initialPrice:2200,color:'#00704a'},
  {code:'HON',name:'홍익대',initialPrice:5000,color:'#1a1a2e'},
  {code:'KHU',name:'경희대',initialPrice:1500,color:'#8c2b3f'},
  {code:'KGU',name:'경기대',initialPrice:3000,color:'#2b5f8c'},
  {code:'SSU',name:'숭실대',initialPrice:4200,color:'#1f6f3f'},
];
const FRIENDS = ['차트왕','학교사랑','눈물의손절','뒷북러','가만히있기'];

const tickSize = p => p<2000?5:p<5000?10:25;
const roundTick = p => { const t=tickSize(p); return Math.max(t, Math.round(p/t)*t); };
const roundLot  = q => Math.max(0, Math.round(q/CFG.lotSize)*CFG.lotSize);
const floorLot  = q => Math.max(0, Math.floor(q/CFG.lotSize)*CFG.lotSize);
const fee = a => Math.round(a*CFG.feeRate);
let _s=1; const rnd=()=>{_s=(_s*1664525+1013904223)>>>0; return _s/4294967296;};
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const pick = a => a[Math.floor(rnd()*a.length)];

/** 현재 판의 설정. 더미는 CFG 로 시작하고, 실서버에서는 snapshot.config 가 덮어쓴다.
    화면은 CFG 가 아니라 항상 CONF 를 읽는다 — 방마다 값이 다를 수 있기 때문이다. */
let CONF = {...CFG};
/** 내가 낸 공모 청약 — 서버는 남의 것과 합산한 ipoDemand 만 주므로 내 몫은 화면이 기억한다. */
const MY_IPO_BIDS = {}, MY_IPO_COST = {};
/** 차트 이력. 실서버 스냅샷에는 이력이 없으므로 화면이 1초에 한 점씩 쌓는다. */
const HIST = {};
function pushHist(snap){
  if(snap.phase!=='trading') return;
  const t=snap.elapsedSec;
  for(const st of snap.stocks){
    const h=HIST[st.code]||(HIST[st.code]=[]);
    if(h.length && h[h.length-1].t>=t) continue;
    h.push({t,price:st.last,fair:st.fair});
    if(h.length>1800) h.shift();
  }
}
function syncConf(snap){ if(snap && snap.config) CONF = {...CONF, ...snap.config}; }

const G = {
  phase:'lobby', cfg:{...CFG}, speed:1, elapsed:0, ipoElapsed:0, seq:0,
  stocks:[], players:[], me:null, notices:[], tape:[], news:[], newsLog:[], salaryCount:0, endedAt:null,
};

function makeStocks(codes){
  const totalSeed = G.cfg.seedMoney * (G.players.length || 1);
  const cap = totalSeed * G.cfg.floatCapitalRatio / codes.length;
  return codes.map(c=>{
    const p = POOL.find(x=>x.code===c);
    return {...p, fair:p.initialPrice, last:p.initialPrice, open:p.initialPrice,
      high:p.initialPrice, low:p.initialPrice, volume:0,
      float:roundLot(cap/p.initialPrice)||CFG.lotSize, issued:0,
      bids:[], asks:[], history:[], ipoBids:[]};
  });
}
function makePlayers(){
  const arr=[{id:'me',name:'나',isBot:false,human:true}];
  FRIENDS.forEach((n,i)=>arr.push({id:'f'+i,name:n,isBot:false,human:true,sim:true}));
  const types=[]; for(const [t,w] of Object.entries(G.cfg.botMix))
    for(let i=0;i<Math.round(w*G.cfg.botCount);i++) types.push(t);
  while(types.length<G.cfg.botCount) types.push('trend');
  for(let i=0;i<G.cfg.botCount;i++)
    arr.push({id:'b'+i,name:'봇'+(i+1),isBot:true,human:false,type:types[i]});
  return arr.map(p=>({...p, type:p.type||pick(['trend','trend','maker','noise','value','contra']),
    cash:G.cfg.seedMoney, holdings:{}, cost:{}, bonus:{}, realized:0, salaryTotal:0, orders:[],
    react:rnd()*CFG.news.reactionSec,
    bias:0.3+rnd()*0.4}));
}

function heldValue(p){ let v=0; for(const s of G.stocks) v+=(p.holdings[s.code]||0)*s.last; return v; }
function lockedCash(p){ let v=0; for(const o of p.orders) if(o.side==='buy') v+=o.price*o.qty; return v; }
function nav(p){ return p.cash + lockedCash(p) + heldValue(p); }
function invested(p){ return G.cfg.seedMoney + p.salaryTotal; }

/* ---- 체결 엔진 ---- */
function notice(text,kind){ G.notices.push({seq:++G.seq,ts:Date.now(),text,kind});
  if(G.notices.length>40) G.notices.shift(); }
function recordTrade(s,price,qty,side){
  G.tape.push({seq:++G.seq,code:s.code,price,qty,side,t:Math.round(G.elapsed)});
  if(G.tape.length>20) G.tape.shift();
  s.last=price; s.high=Math.max(s.high,price); s.low=Math.min(s.low,price); s.volume+=qty;
}
/* 체결 한 건. 매수 원금은 "대기 주문이면 이미 예치됨 / 공격 주문이면 지금 지불" 로 갈린다.
   여기 한 곳에서만 현금이 움직인다 — 두 군데서 만지면 이중 계상이 난다. */
function execute(s,resting,aggressor,aggSide,q){
  const price=resting.price, amt=price*q, f=fee(amt);
  const rp=G.players.find(p=>p.id===resting.playerId); if(!rp) return;
  const buyer = aggSide==='buy'? aggressor : rp;
  const seller= aggSide==='buy'? rp : aggressor;
  if(buyer===aggressor) buyer.cash-=amt;      // 대기 매수는 place() 에서 이미 예치했다
  buyer.cash-=f;
  seller.cash+=amt-f;
  buyer.holdings[s.code]=(buyer.holdings[s.code]||0)+q;
  buyer.cost[s.code]=(buyer.cost[s.code]||0)+amt+f;
  const sq=seller.holdings[s.code]||0, sc=seller.cost[s.code]||0;
  const unit=sq? sc/sq : price;
  seller.holdings[s.code]=Math.max(0,sq-q);
  seller.cost[s.code]=Math.max(0,sc-unit*q);
  seller.realized+=(amt-f)-unit*q;
  recordTrade(s,price,q,aggSide);
  if(buyer.id==='me') pushFill({code:s.code,name:s.name,side:'buy',price,qty:q,amount:amt,fee:f});
  if(seller.id==='me') pushFill({code:s.code,name:s.name,side:'sell',price,qty:q,amount:amt,fee:f});
}
function place(player,s,side,price,qty,market){
  qty=floorLot(qty); if(qty<=0) return {filled:0,resting:0,orderId:null};
  const book = side==='buy'? s.asks : s.bids;
  book.sort((a,b)=> side==='buy'? a.price-b.price : b.price-a.price);
  const crosses = o => market || (side==='buy'? o.price<=price : o.price>=price);
  let filled=0;
  while(qty>0 && book.length && crosses(book[0])){
    const o=book[0];
    if(o.playerId===player.id) break;                       // 자기 주문끼리는 체결 안 된다
    const q=Math.min(qty,o.qty);
    if(side==='buy'  && player.cash < o.price*q+fee(o.price*q)) break;
    if(side==='sell' && (player.holdings[s.code]||0) < q) break;
    execute(s,o,player,side,q);
    o.qty-=q; qty-=q; filled+=q;
    if(o.qty<=0){ book.shift();
      const op=G.players.find(p=>p.id===o.playerId);
      if(op) op.orders=op.orders.filter(x=>x.id!==o.id); }
  }
  if(market||qty<=0) return {filled,resting:0,orderId:null};
  if(side==='buy') qty=Math.min(qty,floorLot(player.cash/price));
  else { const resting=player.orders.filter(o=>o.code===s.code&&o.side==='sell')
           .reduce((a,o)=>a+o.qty,0);
         qty=Math.min(qty,floorLot((player.holdings[s.code]||0)-resting)); }
  if(qty<=0) return {filled,resting:0,orderId:null};
  const o={id:'o'+(++G.seq),playerId:player.id,code:s.code,side,price,qty};
  (side==='buy'? s.bids : s.asks).push(o); player.orders.push(o);
  if(side==='buy') player.cash-=price*qty;                  // 매수는 원금 예치
  return {filled,resting:qty,orderId:o.id};
}
function cancel(player,orderId){
  const o=player.orders.find(x=>x.id===orderId); if(!o) return 0;
  const s=G.stocks.find(x=>x.code===o.code);
  const book = o.side==='buy'? s.bids : s.asks;
  const i=book.findIndex(x=>x.id===orderId); if(i>=0) book.splice(i,1);
  player.orders=player.orders.filter(x=>x.id!==orderId);
  if(o.side==='buy') player.cash+=o.price*o.qty;
  return o.qty;
}

/* ---- 봇 ---- */
function botAct(b){
  const s=pick(G.stocks);
  const held=b.holdings[s.code]||0;
  if(b.type==='maker'){
    const sp=s.last*CFG.makerSpread;
    if(b.cash>s.last*CFG.lotSize*2) place(b,s,'buy',roundTick(s.last-sp),CFG.lotSize*(1+Math.floor(rnd()*3)));
    if(held>=CFG.lotSize) place(b,s,'sell',roundTick(s.last+sp),CFG.lotSize*(1+Math.floor(rnd()*3)));
    return;
  }
  const back=s.history.filter(h=>h.t>=G.elapsed-CFG.lookbackSec);
  const mom = back.length>1 ? s.last/back[0].price-1 : 0;
  const val = s.fair? s.last/s.fair-1 : 0;
  let score=0;
  if(b.type==='trend') score=mom*4;
  else if(b.type==='contra') score=-mom*4;
  else if(b.type==='value') score=-val*6;
  else score=(b.bias-0.5)*2 + gauss()*0.3;
  // 봇은 사람과 같은 정보(현재가·적정가)를 본다. 괴리가 벌어지면 모두가 조금씩 메우려 한다 —
  // 이게 없으면 인플레로 오른 적정가를 체결가가 못 따라가 전 종목이 -30% 저평가로 굳는다.
  score += -val*1.5 + newsPull(s,b);
  const buy = score>0;
  const qty = buy ? Math.max(CFG.lotSize, floorLot(b.cash*0.05/s.last))
                  : Math.max(CFG.lotSize, floorLot(held*0.15));
  const off = s.last*(0.001+rnd()*0.006)*(buy?1:-1);
  const px = roundTick(s.last+off);
  if(buy){ if(b.cash>px*qty*1.01) place(b,s,'buy',px,qty); }
  else if(held>=qty) place(b,s,'sell',px,qty);
}

/* ---- 진행 ---- */
function issueBonus(){
  const cashAdded=G.cfg.salaryAmount*G.players.length;
  let stockValue=0; for(const s of G.stocks) for(const p of G.players) stockValue+=(p.holdings[s.code]||0)*s.last;
  if(stockValue<=0) return;
  const rate=Math.min(G.cfg.maxBonusRate, cashAdded/stockValue);
  let mine=[];
  for(const s of G.stocks){ let add=0;
    for(const p of G.players){ const h=p.holdings[s.code]||0; const b=Math.floor(h*rate);
      if(b>0){ p.holdings[s.code]=h+b; p.bonus[s.code]=(p.bonus[s.code]||0)+b; add+=b;
        if(p.id==='me') mine.push(s.name+' +'+b); } }
    s.issued+=add;
  }
  notice(`무상증자 ${(rate*100).toFixed(1)}%${mine.length?' — '+mine.join(', '):''}`,'bonus');
  return {rate,mine};
}
function spawnNews(){
  const N=G.cfg.news; if(!N.enabled) return;
  G.news=G.news.filter(x=>G.elapsed-x.t < x.lifeSec);
  if(G.news.length>=N.maxActive) return;
  const s=pick(G.stocks.filter(x=>!G.news.some(nw=>nw.code===x.code))); if(!s) return;
  const sign=rnd()<N.positiveRatio?1:-1;
  const list=sign>0?NEWS_POS:NEWS_NEG;
  const mag=N.impact*(0.6+rnd()*0.8);
  s.fair=Math.max(1,s.fair*(1+sign*mag));
  const nw={id:'n'+(++G.seq),code:s.code,name:s.name,sign,
    headline:list[Math.floor(rnd()*list.length)].replace('{n}',s.name),
    impactPct:sign*mag*100, t:G.elapsed, lifeSec:N.lifeSec};
  G.news.push(nw); G.newsLog.push(nw);
  notice(nw.headline, sign>0?'news-up':'news-down');
  if(typeof onNews==='function') onNews(nw);
}
/** 봇 동조 — 뉴스를 인지한 봇만 반응한다. 인지 시점은 봇마다 흩어져 있다. */
function newsPull(s,b){
  const N=G.cfg.news; let v=0;
  for(const nw of G.news){ if(nw.code!==s.code) continue;
    const age=G.elapsed-nw.t; if(age<b.react) continue;
    const remain=Math.max(0,1-age/nw.lifeSec);
    v += nw.sign*N.strength*(nw.sign<0?N.negativeMultiplier:1)*remain; }
  return v;
}
function tick(dt){
  if(G.phase==='ipo'){
    G.ipoElapsed+=dt;
    for(const s of G.stocks){
      if(rnd()<0.35){ const b=pick(G.players.filter(p=>p.id!=='me'));
        const px=roundTick(s.initialPrice*(1+rnd()*0.25));
        const q=floorLot(b.cash*0.12/px);
        if(q>0 && b.cash>=px*q){ b.cash-=px*q; s.ipoBids.push({playerId:b.id,price:px,qty:q}); } }
    }
    if(G.ipoElapsed>=G.cfg.ipoSec) closeIpo();
    return;
  }
  if(G.phase!=='trading') return;
  G.elapsed+=dt;
  const drift=Math.log(1+G.cfg.inflationPerMin)*(dt/60);
  const sig=G.cfg.idioVolatility*Math.sqrt(dt/(G.cfg.durationMin*60));
  for(const s of G.stocks){ s.fair=Math.max(1,s.fair*Math.exp(drift+gauss()*sig));
    const t=Math.round(G.elapsed);
    if(!s.history.length||s.history[s.history.length-1].t<t)
      s.history.push({t,price:s.last,fair:Math.round(s.fair)});
    if(s.history.length>1800) s.history.shift(); }
  for(const b of G.players) if(b.isBot||b.sim) if(rnd()<G.cfg.botActionRate*(dt/0.25)) botAct(b);
  G.news=G.news.filter(x=>G.elapsed-x.t < x.lifeSec);
  if(rnd() < dt/G.cfg.news.intervalSec) spawnNews();
  const due=Math.floor(G.elapsed/G.cfg.salaryIntervalSec);
  if(due>G.salaryCount){ G.salaryCount=due;
    for(const p of G.players){ p.cash+=G.cfg.salaryAmount; p.salaryTotal+=G.cfg.salaryAmount; }
    notice(`월급 ${G.cfg.salaryAmount.toLocaleString()}원 지급`,'salary');
    const b=issueBonus();
    pushSalary(b);
  }
  if(G.elapsed>=G.cfg.durationMin*60){ G.phase='ended'; G.endedAt=Date.now(); notice('장 마감','close'); }
}
function closeIpo(){
  for(const s of G.stocks){
    const bids=[...s.ipoBids].sort((a,b)=>b.price-a.price);
    let cum=0, clearing=s.initialPrice;
    for(const b of bids){ cum+=b.qty; clearing=b.price; if(cum>=s.float) break; }
    const eligible=bids.filter(b=>b.price>=clearing);
    const demand=eligible.reduce((a,b)=>a+b.qty,0);
    const ratio=demand>0?Math.min(1,s.float/demand):0;
    let issued=0;
    for(const b of eligible){
      const alloc=floorLot(b.qty*ratio); const p=G.players.find(x=>x.id===b.playerId);
      const spend=alloc*clearing, f=fee(spend);
      p.cash += b.price*b.qty;              // 증거금 전액 환불
      if(alloc>0 && p.cash>=spend+f){
        p.cash-=spend+f; p.holdings[s.code]=(p.holdings[s.code]||0)+alloc;
        p.cost[s.code]=(p.cost[s.code]||0)+spend+f; issued+=alloc;
        if(p.id==='me') pushFill({code:s.code,name:s.name,side:'buy',price:clearing,qty:alloc,
          amount:spend,fee:f,tag:'공모'});
      }
    }
    for(const b of bids.filter(b=>b.price<clearing)){
      const p=G.players.find(x=>x.id===b.playerId); if(p) p.cash+=b.price*b.qty;
    }
    s.open=clearing; s.last=clearing; s.high=clearing; s.low=clearing; s.issued=issued;
    s.ipoBids=[]; s.history=[{t:0,price:clearing,fair:Math.round(s.fair)}];
  }
  G.phase='trading'; notice('정규장 개장','open');
  for(let i=0;i<160;i++) botAct(pick(G.players.filter(p=>p.isBot)));
  go('market');
}

/* ---- API (SWAP POINT) ---------------------------------------------------
   진짜 서버로 바꿀 때: 아래 함수들을 fetch/EventSource 로 교체하면 된다.
     getMeta      → GET  /api/meta
     createRoom   → POST /api/rooms
     start        → POST /api/rooms/{code}/start
     ipoBid       → POST /api/rooms/{code}/ipo-bids
     order/cancel → POST /api/rooms/{code}/orders , /orders/cancel
     snapshot/me  → SSE  /api/rooms/{code}/stream 의 state 이벤트
   ------------------------------------------------------------------------ */
let API;
const MockAPI = {
  getMeta:()=>({stockPool:POOL, defaults:{...CFG}}),
  createRoom(cfg){
    Object.assign(G.cfg,cfg); G.players=makePlayers(); G.me=G.players[0];
    G.stocks=makeStocks(cfg.stockCodes); G.notices=[]; G.tape=[];
    G.elapsed=0; G.ipoElapsed=0; G.salaryCount=0; G.endedAt=null;
    G.phase = G.cfg.ipoSec>0 ? 'ipo' : 'trading';
    if(G.phase==='trading'){
      // 공모를 끄면 아무도 주식이 없어 매도 호가가 영원히 안 생긴다.
      // 서버의 initialShares 처럼 발행량을 초기가로 균등 배정해 시장이 돌게 한다.
      for(const s of G.stocks){
        s.open=s.initialPrice; s.history=[{t:0,price:s.last,fair:s.initialPrice}];
        const each=floorLot(s.float/G.players.length); let issued=0;
        for(const p of G.players){
          const cost=each*s.initialPrice;
          if(each<=0||p.cash<cost) continue;
          p.cash-=cost; p.holdings[s.code]=(p.holdings[s.code]||0)+each;
          p.cost[s.code]=(p.cost[s.code]||0)+cost; issued+=each;
        }
        s.issued=issued;
      }
      for(let i=0;i<160;i++) botAct(pick(G.players.filter(p=>p.isBot))); }
    return {roomCode:'DEMO'+Math.floor(rnd()*900+100)};
  },
  ipoBid(code,price,qty){
    const s=G.stocks.find(x=>x.code===code); const need=price*qty;
    if(G.me.cash<need) return {error:{code:'INSUFFICIENT_CASH',message:'현금이 부족합니다'}};
    G.me.cash-=need; s.ipoBids.push({playerId:'me',price,qty});
    return {code,price,qty,reserved:need};
  },
  order(code,side,price,qty,market){
    if(G.phase!=='trading') return {error:{code:'NOT_TRADING',message:'거래 시간이 아닙니다'}};
    const s=G.stocks.find(x=>x.code===code);
    if(market){ const book=side==='buy'?s.asks:s.bids;
      if(!book.length) return {error:{code:'NO_COUNTERPARTY',message:'반대 호가가 없습니다'}}; }
    if(side==='buy'){ const cost=(market? s.last:price)*qty;
      if(G.me.cash<cost) return {error:{code:'INSUFFICIENT_CASH',message:'현금이 부족합니다'}}; }
    else { const free=(G.me.holdings[code]||0)-G.me.orders.filter(o=>o.code===code&&o.side==='sell')
        .reduce((a,o)=>a+o.qty,0);
      if(free<qty) return {error:{code:'INSUFFICIENT_SHARES',message:'보유 주식이 부족합니다'}}; }
    return place(G.me,s,side,price,qty,market);
  },
  cancel(id){ return {cancelled:cancel(G.me,id)}; },
  snapshot(){
    const depth=s=>{
      const agg=(arr,desc)=>{ const m=new Map();
        for(const o of arr) m.set(o.price,(m.get(o.price)||0)+o.qty);
        return [...m.entries()].map(([price,qty])=>({price,qty}))
          .sort((a,b)=>desc?b.price-a.price:a.price-b.price).slice(0,10); };
      return {bids:agg(s.bids,true), asks:agg(s.asks,false)};
    };
    const rank=G.players.filter(p=>p.human).map(p=>({id:p.id,name:p.name,isBot:false,
      nav:Math.round(nav(p)),pnl:Math.round(nav(p)-invested(p)),
      pnlPct:(nav(p)/invested(p)-1)*100})).sort((a,b)=>b.nav-a.nav)
      .map((p,i)=>({rank:i+1,...p}));
    return {phase:G.phase, elapsedSec:Math.round(G.elapsed),
      ipoRemainSec:Math.max(0,Math.ceil(G.cfg.ipoSec-G.ipoElapsed)),
      remainSec:Math.max(0,Math.ceil(G.cfg.durationMin*60-G.elapsed)),
      playerCount:G.players.length, humanCount:G.players.filter(p=>p.human).length,
      config:{...G.cfg},
      stocks:G.stocks.map(s=>({code:s.code,name:s.name,color:s.color,last:s.last,
        fair:Math.round(s.fair),open:s.open,high:s.high,low:s.low,volume:s.volume,
        float:s.float,issued:s.issued,
        changePct:(s.last/s.open-1)*100, vsFairPct:s.fair?(s.last/s.fair-1)*100:0,
        depth:depth(s), ipoDemand:s.ipoBids.reduce((a,b)=>a+b.qty,0)})),
      ranking:rank.slice(0,20), notices:G.notices.slice(-6), tape:G.tape.slice(-20),
      news:G.news.map(x=>({id:x.id,code:x.code,name:x.name,sign:x.sign,headline:x.headline,
        impactPct:+x.impactPct.toFixed(1),ageSec:Math.round(G.elapsed-x.t),lifeSec:x.lifeSec}))};
  },
  me(){
    const p=G.me;
    const humans=G.players.filter(x=>x.human).map(x=>({id:x.id,nav:nav(x)})).sort((a,b)=>b.nav-a.nav);
    return {id:p.id,name:p.name,cash:Math.round(p.cash),lockedCash:Math.round(lockedCash(p)),
      rank:humans.findIndex(x=>x.id===p.id)+1, rankTotal:humans.length,
      tradable:G.stocks.map(s=>{
        const restSell=p.orders.filter(o=>o.code===s.code&&o.side==='sell').reduce((a,o)=>a+o.qty,0);
        return {code:s.code,name:s.name,last:s.last,
          maxBuyQty:floorLot(p.cash/(s.last*(1+G.cfg.feeRate))),
          maxSellQty:floorLot((p.holdings[s.code]||0)-restSell)};}),
      nav:Math.round(nav(p)),invested:invested(p),salaryTotal:p.salaryTotal,
      realized:Math.round(p.realized),
      holdings:G.stocks.filter(s=>(p.holdings[s.code]||0)>0).map(s=>{
        const qty=p.holdings[s.code], c=p.cost[s.code]||0, ev=qty*s.last;
        return {code:s.code,name:s.name,color:s.color,qty,bonus:p.bonus[s.code]||0,
          locked:p.orders.filter(o=>o.code===s.code&&o.side==='sell').reduce((a,o)=>a+o.qty,0),
          avgPrice:Math.round(c/qty),last:s.last,evalAmount:ev,pnl:Math.round(ev-c),
          pnlPct:c?(ev/c-1)*100:0};}),
      openOrders:p.orders.map(o=>({id:o.id,code:o.code,
        name:G.stocks.find(s=>s.code===o.code).name,side:o.side,price:o.price,qty:o.qty}))};
  },
};
</script>

<script>
/* ============================================================================
   화면
   ========================================================================= */
const $ = s => document.querySelector(s);
const view = $('#view'), toastEl = $('#toasts'), modalEl = $('#modal');
const U = { view:'setup', codes:POOL.map(s=>s.code), dur:15, ipoSec:45, seed:1000000,
            bots:30, name:'나', code:null, tab:'호가', price:0, qty:CONF.lotSize, market:false,
            ipoCode:'SNU', ipoPrice:0, ipoQty:0, sort:'chg' };

const n  = v => Math.round(v).toLocaleString('en-US');
const pc = v => (v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%';
const p1 = v => (v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
const sg = v => (v>=0?'+':'−')+n(Math.abs(v));
const cl = v => v>=0?'var(--up)':'var(--down)';
const clk= s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.round(s)%60).padStart(2,'0');
const esc= s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function light(hex,a=.45){const v=parseInt(hex.slice(1),16),f=x=>Math.round(x+(255-x)*a);
  return '#'+[f(v>>16&255),f(v>>8&255),f(v&255)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const dot = (c,s=9)=>`<span class="dot" style="width:${s}px;height:${s}px;background:${light(c)}"></span>`;
const fairBadge = v => `<span class="badge m" style="background:${v>=5?'var(--warnT)':'var(--surf3)'};
  color:${v>=5?'var(--warn)':'var(--dim)'}">${v>=5?'거품 ':''}${p1(v)}</span>`;
const svg = (d,sz=20,c='var(--dim)',w=1.6)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"
  stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const iBack=`${svg('M15 5l-7 7 7 7',22,'var(--text)',1.8)}`;
const iMinus=svg('M5 12h14',18,'var(--dim)',2), iPlus=svg('M12 5v14M5 12h14',18,'var(--text)',2);

/* ---- 토스트 ---- */
let toasts=[];
function showToast(html,ms=4200){
  const id='t'+Math.random().toString(36).slice(2);
  toasts.push({id,html}); if(toasts.length>3) toasts.shift();
  renderToasts(); setTimeout(()=>{toasts=toasts.filter(t=>t.id!==id);renderToasts();},ms);
}
function renderToasts(){ toastEl.innerHTML = toasts.map(t=>`<div class="toast">${t.html}</div>`).join(''); }
function pushFill(f){
  showToast(`<div style="display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
      justify-content:center;background:${f.side==='buy'?'var(--upT)':'var(--downT)'}">
      ${svg('M4 12.5l5 5L20 6.5',17,f.side==='buy'?'var(--up)':'var(--down)',2)}</div>
    <div class="grow"><div style="font-size:13px;font-weight:700">${f.side==='buy'?'매수':'매도'} 체결 · ${esc(f.name)}${f.tag?' ('+f.tag+')':''}</div>
      <div class="m" style="font-size:11px;color:var(--dim2);margin-top:2px">${n(f.price)} × ${n(f.qty)}주 · 수수료 ${n(f.fee)}</div></div>
    <div class="m" style="font-size:15px;font-weight:700;color:${f.side==='buy'?'var(--up)':'var(--down)'}">
      ${f.side==='buy'?'−':'+'}${n(f.amount)}</div></div>`);
}
/* 돌발뉴스. 판당 약 12건이라 화면을 막는 모달은 쓸 수 없다 — 토스트 + 상단 배너로 알린다.
   sign 과 impactPct 는 방향이 그대로 드러나므로 화면에 쓰지 않는다(헤드라인으로 판단하는 게 설계 의도).
   즉시 체결되는 주문 버튼은 편의가 아니라 밸런스다 — 지정가를 현재가에 걸면 현금이 묶인 채 뒤처진다. */
function onNews(nw){
  const s=API.snapshot().stocks.find(x=>x.code===nw.code); if(!s) return;
  const me=API.me(), tr=me.tradable.find(t=>t.code===nw.code)||{maxBuyQty:0,maxSellQty:0};
  const bpx=roundTick(s.last*1.02), spx=roundTick(s.last*0.98);
  const canSell=tr.maxSellQty>=CONF.lotSize;
  showToast(`<div style="display:flex;align-items:center;gap:9px">
      <span class="badge" style="background:var(--warnT);color:var(--warn);gap:4px;letter-spacing:.04em">
        ${svg('M13 3L5 14h6l-1 7 8-11h-6l1-7z',12,'var(--warn)',1.6)}돌발 뉴스</span>
      ${dot(s.color,8)}<span style="font-size:12px;color:var(--dim)">${s.name}</span>
      <span class="grow"></span>
      <span class="m" style="font-size:12px;font-weight:700">${n(s.last)}</span>${fairBadge(s.vsFairPct)}</div>
    <button data-act="stock" data-v="${nw.code}" style="display:block;width:100%;text-align:left;
      font-size:15px;font-weight:700;line-height:1.4;margin-top:9px">${esc(nw.headline)}</button>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button data-act="newsSell" data-v="${nw.code}" ${canSell?'':'disabled'}
        style="flex:1;height:46px;border-radius:11px;background:${canSell?'var(--downT)':'transparent'};
        border:1px solid ${canSell?'var(--down)':'var(--line)'};color:${canSell?'var(--down)':'var(--dim2)'};
        font-size:14px;font-weight:700">바로 매도 ${canSell?n(spx):''}</button>
      <button data-act="newsBuy" data-v="${nw.code}"
        style="flex:1;height:46px;border-radius:11px;background:var(--up);color:#fff;
        font-size:14px;font-weight:700">바로 매수 ${n(bpx)}</button></div>
    <div style="font-size:10px;color:var(--dim2);margin-top:8px">한두 호가 위아래로 질러야 즉시 체결됩니다. 지정가를 현재가에 걸면 현금이 묶인 채 밀립니다.</div>`, 11000);
}
function newsBanner(snap){
  if(!snap.news.length) return '';
  return `<div class="pad" style="padding-top:12px;display:flex;flex-direction:column;gap:6px">
    ${snap.news.map(nw=>{const st=snap.stocks.find(x=>x.code===nw.code);
      return `<button data-act="stock" data-v="${nw.code}" style="width:100%;text-align:left;display:flex;
        align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--warnT);
        border:1px solid rgba(245,165,36,.3);min-height:44px">
        ${svg('M13 3L5 14h6l-1 7 8-11h-6l1-7z',15,'var(--warn)',1.6)}
        <span class="grow" style="font-size:12px;font-weight:600;line-height:1.4">${esc(nw.headline)}</span>
        <span class="m" style="font-size:11px;color:var(--dim2);flex-shrink:0">${nw.lifeSec-nw.ageSec}초</span>
      </button>`;}).join('')}</div>`;
}
function salaryTicks(snap){ return Math.floor(snap.elapsedSec/(CONF.salaryIntervalSec||60)); }
function pushSalary(b){
  const mine=(b&&b.mine&&b.mine.length)? b.mine.join(' · ') : '보유 주식이 없어 배정 없음';
  showToast(`<div style="display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
      justify-content:center;background:var(--accT)">${svg('M3 8a2 2 0 012-2h13a1 1 0 011 1v2M3 8v9a2 2 0 002 2h14a1 1 0 001-1v-3M3 8h17M21 11h-4a2 2 0 000 4h4',18,'var(--acc)',1.5)}</div>
    <div class="grow"><div style="font-size:13px;font-weight:700">월급 입금 · ${b&&b.tick?b.tick+'분차':'정산'}</div>
      <div style="font-size:11px;color:var(--dim2);margin-top:2px">무상증자 ${b?(b.rate*100).toFixed(1)+'%':'—'} · ${esc(mine)}</div>
      <div style="font-size:10px;color:var(--dim2);margin-top:3px">인플레는 현금을 깎지 않습니다 — 적정가가 분당 ${(CONF.inflationPerMin*100).toFixed(1)}% 오릅니다</div></div>
    <div class="m" style="font-size:16px;font-weight:700;color:var(--acc)">+${n(CONF.salaryAmount)}</div></div>`);
}
function toastErr(e){ showToast(`<div style="display:flex;gap:10px;align-items:center">
  <div style="width:32px;height:32px;border-radius:10px;background:var(--warnT);flex-shrink:0;
    display:flex;align-items:center;justify-content:center">${svg('M12 8v5M12 16.4v.2M10.3 4.3L2.8 17.5A1.5 1.5 0 004.1 20h15.8a1.5 1.5 0 001.3-2.5L13.7 4.3a1.5 1.5 0 00-2.6 0z',17,'var(--warn)',1.6)}</div>

<script>
/* ---- 4. 개별 종목 ---- */
function vStock(snap,me){
  const s=snap.stocks.find(x=>x.code===U.code)||snap.stocks[0];
  if(!U.price) U.price=s.last;
  const hold=me.holdings.find(h=>h.code===s.code);
  const myOrders=me.openOrders.filter(o=>o.code===s.code);
  const tick=tickSize(s.last);
  // 수량 상한은 서버가 계산해서 준다(me.tradable). 지정가가 현재가보다 높으면 그만큼 줄인다.
  const tr=me.tradable.find(t=>t.code===s.code)||{maxBuyQty:0,maxSellQty:0};
  const px=U.market?s.last:U.price;
  const maxBuy=Math.min(tr.maxBuyQty, floorLot(me.cash/(px*(1+CONF.feeRate))));
  const maxSell=tr.maxSellQty;
  const amt=(U.market?s.last:U.price)*U.qty;
  const mineAt={}; for(const o of myOrders) mineAt[o.price]=(mineAt[o.price]||0)+o.qty;
  const maxQ=Math.max(1,...s.depth.bids.map(d=>d.qty),...s.depth.asks.map(d=>d.qty));
  const qmap=arr=>Object.fromEntries(arr.map(d=>[d.price,d.qty]));
  const ask=qmap(s.depth.asks), bid=qmap(s.depth.bids);
  const priceCell=(p,side,best)=>`<div class="pcell" style="background:${best?'var(--upT)':'var(--surf)'};
      border-left:1px solid ${best?'var(--up)':'var(--line)'}">
      <div class="m" style="font-size:14px;font-weight:${best?700:600};color:${side==='a'?'var(--down)':'var(--up)'}">${n(p)}</div>
      <div class="m" style="font-size:9px;color:var(--dim2)">${pc((p/s.open-1)*100)}</div></div>`;
  let ladder='';

function drawChart(){
  const c=document.getElementById('chart'); if(!c) return;
  const s=API.snapshot().stocks.find(x=>x.code===U.code); if(!s) return;
  const hist=HIST[U.code]||[]; if(hist.length<2) return;
  const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=200;
  c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,w,h);
  const hs=hist, lo=Math.min(...hs.map(p=>Math.min(p.price,p.fair)))*0.99,
        hi=Math.max(...hs.map(p=>Math.max(p.price,p.fair)))*1.01;
  const X=i=>hs.length<2?0:i/(hs.length-1)*(w-46), Y=v=>(hi-v)/(hi-lo||1)*(h-24)+8;
  g.strokeStyle='#2E3540'; g.lineWidth=1; g.beginPath();
  g.moveTo(0,Y(s.open)); g.lineTo(w-46,Y(s.open)); g.stroke();
  g.setLineDash([5,4]); g.strokeStyle='#F5A524'; g.lineWidth=1.6; g.beginPath();
  hs.forEach((p,i)=>i?g.lineTo(X(i),Y(p.fair)):g.moveTo(X(i),Y(p.fair))); g.stroke();
  g.setLineDash([]); g.strokeStyle='#FF4D5E'; g.lineWidth=1.8;
  g.lineJoin='round'; g.beginPath();
  hs.forEach((p,i)=>i?g.lineTo(X(i),Y(p.price)):g.moveTo(X(i),Y(p.price))); g.stroke();
  g.font='600 10px "IBM Plex Mono",monospace'; g.textBaseline='middle';
  const pill=(v,y,bg,fg)=>{const t=n(v),tw=g.measureText(t).width+10;
    g.fillStyle=bg; g.beginPath(); g.roundRect(w-tw-2,y-9,tw,18,4); g.fill();
    g.fillStyle=fg; g.fillText(t,w-tw+3,y);};
  pill(s.last,Y(s.last),'#FF4D5E','#fff'); pill(Math.round(s.fair),Y(s.fair),'#F5A524','#0A0C10');
}

    <div style="display:flex;align-items:center">
      <div class="grow" style="font-size:14px;font-weight:700">보유 종목
        <span style="color:var(--dim2);font-weight:500">${holds.length}</span></div>
      <div class="m" style="font-size:11px;color:var(--dim2)">평가 ${n(evalTotal)}</div></div></div>
  ${holds.length? `<div style="border-top:1px solid var(--line)">${holds.map(h=>`
    <button data-act="stock" data-v="${h.code}" class="row" style="height:74px;width:100%;text-align:left">
      ${dot(h.color)}
      <div class="grow"><div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:15px;font-weight:600">${h.name}</span>
          ${h.bonus?`<span class="badge m" style="background:var(--accT);color:var(--acc)">증자 +${n(h.bonus)}</span>`:''}
          ${h.locked?`<span class="badge m" style="background:var(--surf3);color:var(--dim2)">매도중 ${n(h.locked)}</span>`:''}</div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:4px">${n(h.qty)}주 · 평단 ${n(h.avgPrice)} → ${n(h.last)}</div></div>
      <div class="rt"><div class="m" style="font-size:15px;font-weight:700">${n(h.evalAmount)}</div>
        <div class="m" style="font-size:12px;font-weight:600;margin-top:3px;color:${cl(h.pnl)}">${sg(h.pnl)} · ${pc(h.pnlPct)}</div></div>
    </button>`).join('')}</div>`
  : `<div class="pad"><div class="card" style="padding:24px 20px;text-align:center">
      <div style="font-size:14px;font-weight:600;color:var(--dim)">보유한 주식이 없습니다</div>
      <div style="font-size:12px;color:var(--dim2);line-height:1.6;margin-top:8px">
        주식이 없으면 매분 들어오는 무상증자를 한 주도 받지 못합니다.<br>시황에서 종목을 골라 매수해 보세요.</div>
      <button data-act="go" data-v="market" class="cta" style="height:48px;margin-top:16px">시황으로</button></div></div>`}

  <div class="pad" style="padding-top:22px;padding-bottom:10px">
    <div style="display:flex;align-items:center">
      <div class="grow" style="font-size:14px;font-weight:700">미체결 주문
        <span style="color:var(--dim2);font-weight:500">${me.openOrders.length}</span></div>
      ${me.lockedCash?`<div class="m" style="font-size:11px;color:var(--dim2)">묶인 현금 ${n(me.lockedCash)}</div>`:''}</div></div>
  ${me.openOrders.length? `<div style="border-top:1px solid var(--line)">${me.openOrders.map(o=>`
    <div class="row" style="height:64px">
      <div class="grow"><div style="display:flex;align-items:center;gap:6px">
          <span class="badge" style="background:${o.side==='buy'?'var(--upT)':'var(--downT)'};color:${o.side==='buy'?'var(--up)':'var(--down)'}">${o.side==='buy'?'매수':'매도'}</span>
          <span style="font-size:14px;font-weight:600">${o.name}</span></div>
        <div class="m" style="font-size:11px;color:var(--dim2);margin-top:4px">${n(o.price)} × ${n(o.qty)}주 = ${n(o.price*o.qty)}원</div></div>
      <button data-act="cancel" data-v="${o.id}" style="height:44px;padding:0 14px;border-radius:10px;
        border:1px solid var(--line2);color:var(--dim);font-size:13px;font-weight:600">취소</button></div>`).join('')}</div>`
  : `<div class="pad"><div style="font-size:12px;color:var(--dim2);padding:4px 2px 0">걸어둔 주문이 없습니다.</div></div>`}
  <div style="height:20px"></div>
  ${bottomNav('assets')}`;
}

/* ---- 라우터 · 루프 ---- */
function go(v){ U.view=v; if(v==='stock'){U.tab='호가';} view.scrollTop=0; render(); }
function render(){
  const snap=API.snapshot(); syncConf(snap); pushHist(snap);
  const me = (LIVE.on || G.me) ? API.me() : null;
  const st=view.scrollTop;
  view.innerHTML = U.view==='setup'? vSetup()
    : U.view==='ipo'? vIpo(snap,me)
    : U.view==='assets'? vPortfolio(snap,me)
    : U.view==='stock'? vStock(snap,me)
    : U.view==='result'? vResult(snap,me)
    : vMarket(snap,me);
  view.scrollTop=st;
  modalEl.innerHTML = snap.paused ? `<div class="modalbg">
    <div class="modal" style="text-align:center;padding:32px 24px">
      <div style="display:flex;justify-content:center">${svg('M9 6v12M15 6v12',34,'var(--acc)',2)}</div>
      <div style="font-size:20px;font-weight:700;margin-top:14px">일시정지</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6;margin-top:8px">
        방장이 게임을 멈췄습니다. 남은 시간도 함께 멈춰 있습니다.</div></div></div>` : '';
  if(U.view==='stock'&&U.tab==='차트') drawChart();
}
function routePhase(ph){
  if(ph==='ipo'&&U.view!=='ipo') U.view='ipo';
  if(ph==='ended'&&U.view!=='result') U.view='result';
}
let last=performance.now();
setInterval(()=>{
  const now=performance.now(); const dt=Math.min(1,(now-last)/1000); last=now;
  if(LIVE.on){ if(LIVE.snap){ routePhase(LIVE.snap.phase); render(); } return; }
  if(G.phase==='ipo'||G.phase==='trading'){ tick(dt); routePhase(G.phase); render(); }
},250);

/* ---- 입력 ---- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, k=b.dataset.k;
  const snap=API.snapshot(); const s=snap.stocks.find(x=>x.code===U.code);
  if(a==='set'){ const num=!isNaN(Number(v))&&k!=='tab'&&k!=='sort';
    U[k]= k==='market'? v==='1' : (num? Number(v) : v);
    if(k==='tab'&&v==='차트') setTimeout(drawChart,0); }
  else if(a==='tog'){ U.codes = U.codes.includes(v)? U.codes.filter(c=>c!==v) : [...U.codes,v]; }
  else if(a==='start'){ if(U.codes.length<2) return;
    b.disabled=true; b.textContent='시작하는 중…';
    const r=await API.createRoom({stockCodes:U.codes,durationMin:U.dur,ipoSec:U.ipoSec,
      seedMoney:U.seed,botCount:U.bots});
    if(r&&r.error){ toastErr(r.error); render(); return; }
    for(const k in MY_IPO_BIDS) delete MY_IPO_BIDS[k];
    for(const k in MY_IPO_COST) delete MY_IPO_COST[k];
    for(const k in HIST) delete HIST[k];
    U.ipoPrice=0; U.ipoQty=0; U.ipoCode=U.codes[0];
    go(API.snapshot().phase==='ipo'?'ipo':'market'); return; }
  else if(a==='ipoPick'){ U.ipoCode=v; U.ipoPrice=0; U.ipoQty=0; }
  else if(a==='ipoP'){ U.ipoPrice=Math.max(tickSize(U.ipoPrice),roundTick(U.ipoPrice+Number(v)*tickSize(U.ipoPrice))); }
  else if(a==='ipoQ'){ U.ipoQty=Math.max(CONF.lotSize,U.ipoQty+Number(v)*CONF.lotSize); }
  else if(a==='ipoPct'){ const st=snap.stocks.find(x=>x.code===U.ipoCode);
    if(st) U.ipoPrice=roundTick(st.open*(1+Number(v)/100)); }
  else if(a==='ipoBid'){ const r=await API.ipoBid(U.ipoCode,U.ipoPrice,U.ipoQty);
    if(r.error) toastErr(r.error); else { MY_IPO_BIDS[U.ipoCode]=(MY_IPO_BIDS[U.ipoCode]||0)+r.qty;
      MY_IPO_COST[U.ipoCode]=(MY_IPO_COST[U.ipoCode]||0)+r.reserved;
      showToast(`<div style="font-size:13px;font-weight:700">청약 접수 · ${esc((snap.stocks.find(x=>x.code===U.ipoCode)||{}).name||'')}</div>
      <div class="m" style="font-size:11px;color:var(--dim2);margin-top:3px">${n(r.price)} × ${n(r.qty)}주 · 증거금 ${n(r.reserved)}원 예치</div>`,2600); } }
  else if(a==='stock'){ U.code=v; U.price=(snap.stocks.find(x=>x.code===v)||{last:0}).last; U.qty=CONF.lotSize; go('stock'); return; }
  else if(a==='go'){
    if(v==='result'){ if(LIVE.on) await LiveAPI.end(); else G.phase='ended'; }
    if(v==='setup'){ if(LIVE.on) LiveAPI.reset(); else G.phase='lobby'; }
    go(v); return; }
  else if(a==='again'){
    const r=await API.createRoom({stockCodes:U.codes,durationMin:U.dur,ipoSec:U.ipoSec,
      seedMoney:U.seed,botCount:U.bots});
    if(r&&r.error){ toastErr(r.error); render(); return; }
    for(const k in MY_IPO_BIDS) delete MY_IPO_BIDS[k];
    for(const k in MY_IPO_COST) delete MY_IPO_COST[k];
    for(const k in HIST) delete HIST[k];
    U.ipoPrice=0; U.ipoQty=0; go(API.snapshot().phase==='ipo'?'ipo':'market'); return; }
  else if(a==='px'){ U.price=Number(v); U.market=false; }
  else if(a==='p'){ U.price=Math.max(tickSize(U.price),roundTick(U.price+Number(v)*tickSize(U.price))); }
  else if(a==='q'){ U.qty=Math.max(CONF.lotSize,U.qty+Number(v)*CONF.lotSize); }
  else if(a==='ratio'){ const me=API.me(); const px=U.market? s.last : U.price;
    U.qty=Math.max(CONF.lotSize,floorLot(me.cash/(px*(1+CONF.feeRate))*Number(v)/100)); }
  else if(a==='newsBuy'||a==='newsSell'){
    const st=snap.stocks.find(x=>x.code===v), me2=API.me();
    const t=me2.tradable.find(x=>x.code===v)||{maxBuyQty:0,maxSellQty:0};
    const buy=a==='newsBuy';
    const px=roundTick(st.last*(buy?1.02:0.98));
    const cap=buy? Math.min(t.maxBuyQty, floorLot(me2.cash/(px*(1+CONF.feeRate)))) : t.maxSellQty;
    const qty=Math.max(CONF.lotSize, floorLot(cap*0.5));
    if(cap<CONF.lotSize){ toastErr({code:buy?'INSUFFICIENT_CASH':'INSUFFICIENT_SHARES',
      message:buy?'현금이 부족합니다':'보유 주식이 부족합니다'}); }
    else { const r=await API.order(v,buy?'buy':'sell',px,qty,false);
      if(r.error) toastErr(r.error); }
  }
  else if(a==='pause'){ if(LIVE.on) { const r=await LiveAPI.pause(v==='1'); if(r&&r.error) toastErr(r.error); } }
  else if(a==='cancel'){ await API.cancel(v); }
  else if(a==='order'){ const r=await API.order(U.code,v,U.market?null:U.price,U.qty,U.market);
    if(r.error) toastErr(r.error);
    else if(!r.filled&&!r.resting) toastErr({code:'NOT_FILLED',message:'체결도 등록도 되지 않았습니다'}); }
  render();
});
</script>

<script>
/* ============================================================================
   실서버 어댑터.  화면은 API.snapshot() / API.me() 만 읽으므로 이 객체만 바뀐다.
   같은 출처에서 /api/health 가 응답하면 실서버, 아니면 더미로 동작한다.
   (Artifact 는 외부 네트워크가 막혀 있어 항상 더미로 떨어진다)
   ========================================================================= */
API = MockAPI;
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
/** 기기 식별자. 이게 없으면 새로고침한 참가자가 게임에서 영구히 튕긴다. */
function deviceId(){
  let d=lsGet('sc.device');
  if(!d){ d = (crypto.randomUUID? crypto.randomUUID() : 'd'+Math.random().toString(36).slice(2)+Date.now());
    lsSet('sc.device', d); }
  return d;
}
const LIVE = { on:false, code:null, hostToken:null, token:null, playerId:null,
               snap:null, me:null, es:null, seenNews:new Set(), lastNotice:0, prevHold:null };
/** 무상증자 누적. 서버가 개인별 배정량을 주지 않으므로 화면이 푸시마다 역산한다.
    보유 증가분 − 이번 푸시의 체결분 = 증자분. 접속이 끊기면 누계는 0부터 다시 센다. */
const BONUS = {};
function trackBonus(me){
  if(!me) return;
  const now={}; for(const h of (me.holdings||[])) now[h.code]=h.qty;
  if(LIVE.prevHold){
    const traded={};
    for(const f of (me.newFills||[])) traded[f.code]=(traded[f.code]||0)+(f.side==='buy'?f.qty:-f.qty);
    for(const code in now){
      const d=now[code]-(LIVE.prevHold[code]||0)-(traded[code]||0);
      if(d>0) BONUS[code]=(BONUS[code]||0)+d;
    }
  }
  LIVE.prevHold=now;
}

const EMPTY_SNAP = () => ({phase:'lobby',elapsedSec:0,remainSec:0,ipoRemainSec:0,
  playerCount:0,humanCount:0,config:{...CONF},stocks:[],ranking:[],notices:[],tape:[],news:[]});
const EMPTY_ME = () => ({id:'',name:'',cash:0,lockedCash:0,nav:0,invested:1,salaryTotal:0,
  realized:0,rank:0,rankTotal:0,holdings:[],openOrders:[],tradable:[]});

async function jreq(method,url,body,extra){
  const r = await fetch(url,{method,
    headers:{'Content-Type':'application/json',...(extra||{})},
    body: body===undefined? undefined : JSON.stringify(body)});
  let j=null; try{ j=await r.json(); }catch(e){ j=null; }
  if(r.status===429){ const wait=r.headers.get('Retry-After')||'1';
    return {error:{code:'RATE_LIMITED',message:`주문이 너무 잦습니다 — ${wait}초 뒤 다시`}}; }
  if(!r.ok && (!j||!j.error)) return {error:{code:'HTTP_'+r.status,message:'서버 오류 ('+r.status+')'}};
  return j||{};
}
const hostHdr   = () => ({'X-Host-Token':LIVE.hostToken});
const playerHdr = () => ({'X-Player-Token':LIVE.token});

/** SSE 로 들어온 새 사건만 골라 팝업으로 올린다. 렌더마다 하면 중복으로 뜬다. */
function onLiveEvent(d){
  const snap=d.snapshot, me=d.me;
  trackBonus(me);
  if(me && me.newFills) for(const f of me.newFills)
    pushFill({code:f.code,name:f.name,side:f.side,price:f.price,qty:f.qty,
      amount:f.amount!=null?f.amount:f.price*f.qty, fee:f.fee!=null?f.fee:0, tag:f.tag});
  if(snap && snap.notices) for(const nt of snap.notices){
    if(nt.seq<=LIVE.lastNotice) continue;
    LIVE.lastNotice=nt.seq;
    if(nt.kind==='salary'||nt.kind==='bonus') showToast(
      `<div style="display:flex;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;
          align-items:center;justify-content:center;background:var(--accT)">
          ${svg('M3 8a2 2 0 012-2h13a1 1 0 011 1v2M3 8v9a2 2 0 002 2h14a1 1 0 001-1v-3M3 8h17M21 11h-4a2 2 0 000 4h4',18,'var(--acc)',1.5)}</div>
        <div class="grow"><div style="font-size:13px;font-weight:700">${esc(nt.text)}</div>
        <div style="font-size:10px;color:var(--dim2);margin-top:3px">인플레는 현금을 깎지 않습니다 — 적정가가 분당 ${((CONF.inflationPerMin||0)*100).toFixed(1)}% 오릅니다</div></div></div>`);
    else if(nt.kind==='ipo'||nt.kind==='open'||nt.kind==='close') showToast(
      `<div style="font-size:13px;font-weight:700">${esc(nt.text)}</div>`,3000);
  }
  if(snap && snap.news) for(const nw of snap.news){
    if(LIVE.seenNews.has(nw.id)) continue;
    LIVE.seenNews.add(nw.id); onNews(nw);
  }
}

function openStream(){
  if(LIVE.es){ try{LIVE.es.close();}catch(e){} }
  LIVE.es = new EventSource(`/api/rooms/${LIVE.code}/stream?token=${encodeURIComponent(LIVE.token)}`);
  LIVE.es.addEventListener('state', ev=>{
    let d=null; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    LIVE.snap=d.snapshot||LIVE.snap; LIVE.me=d.me||LIVE.me;
    syncConf(LIVE.snap); onLiveEvent(d);
  });
}
const LiveAPI = {
  getMeta: () => jreq('GET','/api/meta'),
  async createRoom(cfg){
    LiveAPI.reset();
    const r1 = await jreq('POST','/api/rooms',{title:'Stock Challenge',config:cfg});
    if(r1.error) return r1;
    LIVE.code=r1.roomCode; LIVE.hostToken=r1.hostToken;
    const r2 = await jreq('POST',`/api/rooms/${LIVE.code}/join`,{name:U.name||'나',deviceId:deviceId()});
    if(r2.error) return r2;
    LIVE.token=r2.playerToken; LIVE.playerId=r2.playerId; LIVE.name=r2.name;
    const r3 = await jreq('POST',`/api/rooms/${LIVE.code}/start`,{},hostHdr());
    if(r3.error) return r3;
    LIVE.snap=r3.snapshot||r3; LIVE.me=null;
    openStream();
    lsSet('sc.session',{code:LIVE.code,playerToken:LIVE.token,hostToken:LIVE.hostToken});
    return {roomCode:LIVE.code};
  },
  ipoBid: (code,price,qty) =>
    jreq('POST',`/api/rooms/${LIVE.code}/ipo-bids`,{code,price,qty},playerHdr()),
  order: (code,side,price,qty,market) =>
    jreq('POST',`/api/rooms/${LIVE.code}/orders`,
      {code,side,price:market?'market':price,qty},playerHdr()),
  async cancel(orderId){
    const o=(LIVE.me&&LIVE.me.openOrders||[]).find(x=>x.id===orderId);
    if(!o) return {cancelled:0};
    return jreq('POST',`/api/rooms/${LIVE.code}/orders/cancel`,{code:o.code,orderId},playerHdr());
  },
  end: () => LIVE.code? jreq('POST',`/api/rooms/${LIVE.code}/end`,{},hostHdr()) : {},
  pause: (on) => jreq('POST',`/api/rooms/${LIVE.code}/${on?'pause':'resume-game'}`,{},hostHdr()),
  csv: (type) => `/api/rooms/${LIVE.code}/result.csv?type=${type}`,
  reset(){ if(LIVE.es){ try{LIVE.es.close();}catch(e){} } LIVE.es=null; lsDel('sc.session');
    LIVE.prevHold=null; for(const k in BONUS) delete BONUS[k];
    LIVE.code=LIVE.hostToken=LIVE.token=LIVE.playerId=null;
    LIVE.snap=null; LIVE.me=null; LIVE.seenNews=new Set(); LIVE.lastNotice=0; },
  snapshot: () => LIVE.snap || EMPTY_SNAP(),
  me(){
    const m = LIVE.me || EMPTY_ME();
    // 서버가 안 주는 bonus 를 붙여서 돌려준다. 화면은 me.holdings[].bonus 만 읽으면 된다.
    return {...m, holdings:(m.holdings||[]).map(h=>({...h, bonus:BONUS[h.code]||0}))};
  },
};

/* ---- 부팅: 같은 출처에 서버가 있으면 실서버로 붙는다 ---- */
(async function boot(){
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),1500);
    const r=await fetch('/api/health',{cache:'no-store',signal:ctrl.signal});
    clearTimeout(t);
    if(r.ok){ const j=await r.json(); if(j&&j.ok){ LIVE.on=true; API=LiveAPI; } }
  }catch(e){ /* Artifact 등 서버가 없는 곳 — 더미로 간다 */ }
  if(LIVE.on){
    const saved=lsGet('sc.session');
    if(saved && saved.code && saved.playerToken){
      const r=await jreq('POST',`/api/rooms/${saved.code}/resume`,{playerToken:saved.playerToken});
      if(!r.error){
        LIVE.code=saved.code; LIVE.hostToken=saved.hostToken;
        LIVE.token=r.playerToken||saved.playerToken; LIVE.playerId=r.playerId; LIVE.name=r.name;
        openStream(); U.view='market';
        showToast(`<div style="font-size:13px;font-weight:700">진행 중인 판으로 복귀했습니다</div>
          <div style="font-size:11px;color:var(--dim2);margin-top:3px">${esc(r.name||'')} · ${esc(saved.code)}</div>`,3000);
      } else lsDel('sc.session');
    }
  }
  const meta = LIVE.on ? await API.getMeta().catch(()=>null) : null;
  if(meta && meta.stockPool && meta.stockPool.length){
    POOL.length=0; for(const s of meta.stockPool) POOL.push(s);
    U.codes = POOL.map(s=>s.code);
    if(meta.defaults) CONF={...CONF,...meta.defaults};
  }
  const tag=document.getElementById('mode');
  if(tag) tag.textContent = LIVE.on? '실서버' : '더미 API';
  render();
})();
</script>
